/* ---------------------------------------------------------------
   Theme toggle — simple cross-fade.
   When the browser supports the View Transitions API, toggleTheme()
   calls document.startViewTransition(). That gives us a snapshot of the
   old theme and a snapshot of the new theme stacked on top of each
   other; this just fades the new one in over the old one. Kept to
   opacity only (no clip-path/filter) so there's nothing for the browser
   to resample frame-to-frame. Browsers without support (or people with
   reduced-motion on) just get an instant swap — see the JS fallback in
   toggleTheme().
--------------------------------------------------------------- */
@media (prefers-reduced-motion: no-preference){
  ::view-transition-old(root),
  ::view-transition-new(root){
    animation: none;
    mix-blend-mode: normal;
  }
  ::view-transition-old(root){ z-index: 1; }
  ::view-transition-new(root){
    z-index: 2;
    animation: theme-fade 220ms ease-out;
  }
  @keyframes theme-fade{
    from{ opacity: 0; }
    to{ opacity: 1; }
  }
}

<script>
/* =========================================================
   DATA
========================================================= */
const CATS = [
  {id:'academics', label:'Academics', icon:'📘', color:'--blue'},
  {id:'sports', label:'Sports', icon:'⚽', color:'--green'},
  {id:'abacus', label:'Abacus & Math', icon:'🧮', color:'--amber'},
  {id:'music', label:'Music', icon:'🎵', color:'--pink'},
  {id:'dance', label:'Dance', icon:'💃', color:'--primary2'},
  {id:'coding', label:'Coding', icon:'💻', color:'--primary'},
  {id:'art', label:'Art & Craft', icon:'🎨', color:'--amber'},
];
const AVATAR_COLORS = ['#6C5CE7','#2ECC71','#F5A623','#F472B6','#EC4899','#4FA8F5','#FB6A6A'];

/* =========================================================
   STATE
========================================================= */
const state = {
  view: 'home',
  portal: 'customer', // customer | teacher
  session: null,       // supabase auth session, or null
  profile: null,        // row from `profiles` table for the signed-in user
  selectedTeacherId: null,
  selectedTeacherFrom: 'home',  // 'home' | 'browse' — which page the teacher profile was opened from, for the back button
  filters: { category:'all', query:'', sortDistance:false },
  teacherTab: 'overview',
  studentAuthMode: 'login',   // 'login' | 'signup'
  teacherAuthMode: 'login',
  myLocation: null,      // { lat, lng } for the person browsing — used to auto-calc distance to each teacher
  locatingMe: false,     // true while a geolocation request is in flight
  postLoginRedirect: null,   // { view, selectedTeacherId, selectedTeacherFrom, reopenEnquiryFor } — where (and what) to restore after logging in or signing up mid-action, anywhere on the site
  adminTab: 'teachers',       // 'teachers' | 'students' — which list the admin panel is showing
};
try{
  var savedLoc = localStorage.getItem('npt-my-location');
  if(savedLoc) state.myLocation = JSON.parse(savedLoc);
}catch(e){}
const locationPreviouslyDeclined = (()=>{ try{ return localStorage.getItem('npt-location-declined')==='1'; }catch(e){ return false; } })();

// Great-circle distance between two lat/lng points, in km (Haversine formula).
function haversineKm(lat1, lng1, lat2, lng2){
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI/180;
  const dLng = (lng2 - lng1) * Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// Raw distance in km from the browsing person to a teacher, or null if
// either side's coordinates aren't known yet. Used for sorting.
function distanceKmToTeacher(t){
  if(!state.myLocation || t.lat==null || t.lng==null) return null;
  return haversineKm(state.myLocation.lat, state.myLocation.lng, t.lat, t.lng);
}

// Formatted distance from the browsing person to a teacher, or null if
// either side's coordinates aren't known yet. Always expressed in km.
function distanceToTeacher(t){
  const km = distanceKmToTeacher(t);
  if(km==null) return null;
  return (km < 0.1 ? '<0.1' : km.toFixed(1)) + ' km away';
}

// Ask the browser for the person's current location, store it, and
// re-render whatever list/profile is on screen with fresh distances.
function useMyLocation(){
  if(!navigator.geolocation){ toast('Location isn\'t supported in this browser', 'warn'); return; }
  state.locatingMe = true;
  render();
  navigator.geolocation.getCurrentPosition(
    (pos)=>{
      state.myLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      state.locatingMe = false;
      try{ localStorage.setItem('npt-my-location', JSON.stringify(state.myLocation)); }catch(e){}
      toast('📍 Location set — distances updated', 'ok');
      render();
    },
    (err)=>{
      state.locatingMe = false;
      toast('❌ Couldn\'t get your location — check permissions and try again', 'err');
      render();
    },
    { enableHighAccuracy:false, timeout:10000 }
  );
}

// Same as useMyLocation, but for the one-time entry prompt: gives the
// button in the modal instant feedback and closes the modal when done.
function useMyLocationOnboarding(){
  if(!navigator.geolocation){ toast('Location isn\'t supported in this browser', 'warn'); closeModal(); return; }
  const btn = document.querySelector('[data-action="onboarding-location-allow"]');
  if(btn){ btn.disabled = true; btn.textContent = 'Locating…'; }
  navigator.geolocation.getCurrentPosition(
    (pos)=>{
      state.myLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      try{ localStorage.setItem('npt-my-location', JSON.stringify(state.myLocation)); }catch(e){}
      closeModal();
      toast('📍 Location set — distances updated', 'ok');
      render();
    },
    (err)=>{
      closeModal();
      toast('❌ Couldn\'t get your location — check permissions and try again', 'err');
    },
    { enableHighAccuracy:false, timeout:10000 }
  );
}

function currentTheme(){ return document.documentElement.getAttribute('data-theme') || 'dark'; }

function toggleTheme(btn){
  const next = currentTheme()==='dark' ? 'light' : 'dark';
  const applyTheme = () => {
    document.documentElement.setAttribute('data-theme', next);
    try{ localStorage.setItem('npt-theme', next); }catch(e){}
    render(); // re-render so the toggle button's icon/label stays in sync
  };

  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canAnimate = document.startViewTransition && !reduceMotion;
  if(!canAnimate){ applyTheme(); return; }

  document.startViewTransition(applyTheme);
}

function toast(msg, type){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  const colors = {ok:'linear-gradient(135deg,#2ECC71,#27ae60)', info:'linear-gradient(135deg,#6C5CE7,#EC4899)', warn:'linear-gradient(135deg,#F5A623,#e67e22)', err:'linear-gradient(135deg,#FB6A6A,#c0392b)'};
  el.className = 'toast';
  el.style.background = colors[type||'info'];
  el.style.color = '#fff';
  el.innerHTML = msg;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .4s ease, transform .4s ease'; el.style.opacity='0'; el.style.transform='translateX(40px)'; setTimeout(()=>el.remove(),400); }, 3200);
}

// Puts a button into/out of a spinning "buffering" state while an async
// auth call is in flight, so there's no awkward static gap before the
// next screen appears. Safe to call even if the view has already been
// re-rendered out from under the original button (e.g. after a
// successful login swaps the whole page) — the .finally() just no-ops
// on a detached element.
function setBtnLoading(btn, loading){
  if(!btn) return;
  if(loading){
    if(btn.querySelector('.btn-spinner')) return; // already loading
    btn.classList.add('btn-loading');
    btn.disabled = true;
    const spin = document.createElement('span');
    spin.className = 'btn-spinner';
    btn.appendChild(spin);
  }else{
    btn.classList.remove('btn-loading');
    btn.disabled = false;
    const spin = btn.querySelector('.btn-spinner');
    if(spin) spin.remove();
  }
}

function starString(rating){
  const full = Math.round(rating||0);
  return '★'.repeat(full) + '☆'.repeat(5-full);
}
// Maps a 1–5 rating to a color along a red → amber → green gradient, so
// low ratings read as a warning and high ratings read as a strong
// positive, with a smooth blend in between. 0/no rating stays neutral.
function ratingColor(rating){
  if(!rating) return 'var(--text-dimmer)';
  const clamped = Math.max(1, Math.min(5, rating));
  const hue = (clamped - 1) / 4 * 120; // 1★=0 (red) … 5★=120 (green)
  return `hsl(${hue.toFixed(0)}, 72%, 50%)`;
}
// Translucent background version of ratingColor(), for badge fills.
function ratingColorBg(rating){
  if(!rating) return 'transparent';
  const clamped = Math.max(1, Math.min(5, rating));
  const hue = (clamped - 1) / 4 * 120;
  return `hsla(${hue.toFixed(0)}, 72%, 50%, 0.15)`;
}
// Small inline badge for teacher cards — shows "New" instead of a fake
// star rating for teachers who don't have any reviews yet.
function ratingBadgeSmall(t){
  if(!t.reviews) return `<div class="badge badge-blue">🆕 New</div>`;
  return `<div class="badge" style="background:${ratingColorBg(t.rating)}; color:${ratingColor(t.rating)};">${starString(t.rating)[0]} ${t.rating}</div>`;
}

function isConfigured(){ return !!sb; }

// True the moment refreshProfile() finds a signed-in Google user with no
// profiles row yet — i.e. their very first "Continue with Google" sign-in.
// render() checks this to show the name-entry screen instead of routing
// them anywhere else, until completeOAuthSignup() below resolves it.
let awaitingOAuthName = false;
// The role (student/teacher) they intended, read out of localStorage the
// moment we detect awaitingOAuthName — stashed there right before the
// redirect to Google by signInWithGoogle(), since Google itself has no
// notion of "student vs teacher".
let oauthPendingRole = 'student';

async function refreshProfile(){
  if(!state.session){ state.profile = null; awaitingOAuthName = false; return; }
  const { data, error } = await sb.from('profiles').select('*').eq('id', state.session.user.id).single();
  if(!error){ state.profile = data; awaitingOAuthName = false; return; }
  if(error.code !== 'PGRST116'){ console.error(error); state.profile = null; awaitingOAuthName = false; return; }
  // PGRST116 = no matching row. Email/password sign-up always creates its
  // own profiles row right after auth.signUp() (see signUpStudent/
  // signUpTeacher below), so reaching here means a Google sign-in that
  // hasn't been given a name yet — don't guess it from their Google
  // account; ask them (see viewOAuthNamePrompt / completeOAuthSignup).
  state.profile = null;
  awaitingOAuthName = true;
  try{ oauthPendingRole = localStorage.getItem('npt-oauth-role') || 'student'; }catch(e){ oauthPendingRole = 'student'; }
}

// Screen shown after a first-time Google sign-in, before any profile row
// exists — collects the name to store instead of pulling it from Google.
function viewOAuthNamePrompt(){
  return `

    <div class="glass fade-in" style="padding:36px; width:100%; max-width:420px;">

      <h2 style="font-size:24px; margin:8px 0 10px;">What's your name?</h2>
      <p class="muted" style="font-size:13.5px; margin-bottom:22px;">This is the name ${oauthPendingRole==='teacher' ? 'parents/students' : 'teachers'} will see on NearPath Tutors.</p>
      <div class="field"><label class="field-label">Your name</label><input class="input" id="oauthName" placeholder="Full name" autofocus/></div>
      <button class="btn btn-primary btn-block" data-action="oauth-name-confirm">Continue</button>
    </div>
  </div>`;
}

// Creates the profiles row (and, for a teacher, the teacher_profiles row)
// using the name just entered, then routes them onward exactly like
// signUpStudent/signUpTeacher do for email/password sign-ups.
async function completeOAuthSignup(name){
  name = (name||'').trim();
  if(!name) return toast('Please enter your name', 'warn');
  const user = state.session.user;
  const role = oauthPendingRole || 'student';
  const { data, error } = await sb.from('profiles').insert({ id:user.id, role, full_name:name }).select().single();
  if(error) return toast('❌ ' + error.message, 'err');
  try{ localStorage.removeItem('npt-oauth-role'); }catch(e){}
  awaitingOAuthName = false;
  state.profile = data;
  if(role === 'teacher'){
    const freshTeacherProfile = {
      profile_id:user.id, initials: name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(),
      color: AVATAR_COLORS[Math.floor(Math.random()*AVATAR_COLORS.length)], category:'academics',

  }else{
    studentDataStatus = 'idle';
    toast('🎉 Account created!', 'ok');
    goPostAuth('studentDashboard');
  }
}

// Kicks off "Continue with Google". Stashes the intended role so
// refreshProfile()/viewOAuthNamePrompt() can use it once Google redirects
// back with a session.
async function signInWithGoogle(role){
  try{ localStorage.setItem('npt-oauth-role', role); }catch(e){}
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',

  });
  if(error) toast('❌ ' + error.message, 'err');

let lastAuthUserId = null;
// Supabase fires SIGNED_IN on onAuthStateChange as soon as signUp()/
// signInWithPassword() resolves internally — which lands *before* our own
// signUpStudent/signInStudent/etc functions below finish their own
// refreshProfile() + nav(). Without this flag, that listener's render()
// briefly repaints the still-open auth dialog (now with a session but the
// old view) right before nav() switches to the dashboard, which looks like
// the dialog "reloading" for a moment. The explicit flows set this while
// they're mid-flight so the listener updates state silently and lets the
// explicit flow's own nav()/render() do the (single) visible transition.
let authFlowInProgress = false;

async function boot(){
  if(!isConfigured()){ render(); return; }

  sb.auth.onAuthStateChange(async (_event, session)=>{
    state.session = session;
    // Supabase fires this on token refresh, tab focus, etc — not just on
    // actual login/logout. Only wipe cached dashboard data when the
    // signed-in user id has genuinely changed, otherwise a dashboard
    // that's already loaded gets reset to "loading" and never refetches.
    const newUserId = session?.user?.id || null;
    if(newUserId !== lastAuthUserId){
      await refreshProfile();
      studentDataStatus = 'idle'; teacherDataStatus = 'idle'; adminDataStatus = 'idle';
      lastAuthUserId = newUserId;
    }
    if(authFlowInProgress) return;
    render();
  });

  const { data:{ session } } = await sb.auth.getSession();
  state.session = session;
  lastAuthUserId = session?.user?.id || null;
  await refreshProfile();

  // support ?teacher=<id> deep links (e.g. shared from a teacher's dashboard)
  const params = new URLSearchParams(location.search);
  const sharedTeacher = params.get('teacher');
  if(sharedTeacher){ state.view = 'teacherProfile'; state.selectedTeacherId = sharedTeacher; state.selectedTeacherFrom = 'home'; }

  ensureTeachers();
  render();

  // Ask for the person's location once on entry, so teacher cards can show
  // a live distance right away. Skipped if we already have a location, or
  // they've dismissed this prompt on a previous visit.
  if(!state.myLocation && !locationPreviouslyDeclined){
    openModal(locationPromptModal());
  }
}

// Screens that are themselves part of the login/signup funnel — not worth
// remembering as "where the user was", since landing back on them after
// authenticating would just undo the flow instead of resuming a task.
const AUTH_FUNNEL_VIEWS = new Set(['studentAuth','teacherAuth','teacherHome','teacherOnboarding','adminAuth']);
// Snapshots the current screen right before sending the user off to log in
// or sign up, so they can be dropped back exactly where they were —
// including reopening things like the enquiry form — once they're done.
// Called from every point on the site that redirects to studentAuth/
// teacherAuth because an action needed an account first.
function captureAuthRedirect(extra){
  if(AUTH_FUNNEL_VIEWS.has(state.view)) return; // nothing worth remembering
  state.postLoginRedirect = { view: state.view, selectedTeacherId: state.selectedTeacherId, selectedTeacherFrom: state.selectedTeacherFrom, ...extra };
}
// After logging in or signing up anywhere on the site, this sends the user
// back to whatever screen prompted the login (restoring the teacher profile,
// reopening the enquiry modal, etc.) instead of always dropping them on a
// fixed default screen. Falls back to defaultView when there's nothing to
// restore (e.g. they arrived at the auth screen directly, not mid-task).
function goPostAuth(defaultView){
  const redirect = state.postLoginRedirect;
  state.postLoginRedirect = null;
  if(redirect){
    const { reopenEnquiryFor, ...navState } = redirect;
    nav(navState.view, navState);
    if(reopenEnquiryFor) openModal(enquiryModal(reopenEnquiryFor));
    return;
  }
  nav(defaultView);
}

  try{
    const { data, error } = await sb.auth.signUp({ email, password, options:{ data:{ full_name:name, role:'student' } } });
    if(error) return toast('❌ ' + error.message, 'err');
    if(data.user){
      await sb.from('profiles').insert({ id:data.user.id, role:'student', full_name:name });

    if(data.session){
      state.session = data.session;
      lastAuthUserId = data.session.user.id;

// "wrong password" error if someone fat-fingers the field. The actual gate is
// Supabase auth (the account's real password) plus its profiles.role being
// 'admin', which is what the delete policies in schema.sql check server-side.
async function signInAdmin(username, password){
  if(!username || !password) return toast('Please fill in all fields', 'warn');
  if(username.trim().toLowerCase() !== 'admin') return toast('❌ Unknown admin username', 'err');
  authFlowInProgress = true;
  try{
    const { data, error } = await sb.auth.signInWithPassword({ email: ADMIN_EMAIL, password });
    if(error) return toast('❌ Incorrect password', 'err');
    state.session = data.session;
    lastAuthUserId = data.session?.user?.id || null;
    await refreshProfile();
    if(state.profile?.role !== 'admin'){
      await sb.auth.signOut();

// Step 1 of forgot-password: first check (via the email_exists() SQL
// function — see schema.sql) whether this address is even registered. If
// not, tell the person plainly and offer a sign-up link instead of
// silently sending nothing. Only if it IS registered do we ask Supabase
// to email a 6-digit code. This only works once the email template has
// been switched to show {{ .Token }} — see README "Part 9".
//
// NOTE: this deliberately gives up Supabase's default "don't reveal
// whether an email exists" protection (see the comment on email_exists()
// in schema.sql) in exchange for a clearer error message here.
async function requestPasswordReset(email){
  if(!email) return toast('Please enter your email', 'warn');
  const { data: exists, error: checkError } = await sb.rpc('email_exists', { check_email: email });
  if(checkError) return toast('❌ ' + checkError.message, 'err');
  fpEmail = email;
  if(!exists){ openModal(forgotPasswordModal('not-found')); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email);
  if(error) return toast('❌ ' + error.message, 'err');
  toast('📧 A code is on its way', 'ok');
  openModal(forgotPasswordModal('verify'));
}

// Step 2: verifying the code signs the user in with a short-lived
// "recovery" session, which is exactly enough permission to call
// updateUser() and set a new password — then they're left logged in.
async function confirmPasswordReset(code, newPassword, confirmPassword){
  if(!code || !newPassword || !confirmPassword) return toast('Please fill in all fields', 'warn');
  if(newPassword.length < 6) return toast('Password must be at least 6 characters', 'warn');
  if(newPassword !== confirmPassword) return toast("Passwords don't match", 'warn');
  authFlowInProgress = true;
  try{
    const { data, error } = await sb.auth.verifyOtp({ email: fpEmail, token: code, type: 'recovery' });
    if(error) return toast('❌ ' + error.message, 'err');
    const { error: updateError } = await sb.auth.updateUser({ password: newPassword });
    if(updateError) return toast('❌ ' + updateError.message, 'err');
    state.session = data.session;
    lastAuthUserId = data.session?.user?.id || null;
    await refreshProfile();
    closeModal();
    toast('✅ Password updated — you\'re logged in', 'ok');
    if(state.profile?.role==='teacher'){ teacherDataStatus = 'idle'; goPostAuth('teacherDashboard'); }
    else if(state.profile?.role==='admin'){ nav('adminDashboard'); }
    else{ studentDataStatus = 'idle'; goPostAuth('studentDashboard'); }
  }finally{
    authFlowInProgress = false;
  }
}

async function ensureStudentData(force){

    const uid = state.session.user.id;
    const [{data:enrollments, error:e1}, {data:payments, error:e2}, {data:reviews, error:e3}] = await Promise.all([
      sb.from('enrollments').select('*, teacher_profiles(profiles(full_name))').eq('student_id', uid).order('created_at',{ascending:false}),
      sb.from('payments').select('*').eq('student_id', uid).order('paid_at',{ascending:false}),
      sb.from('reviews').select('*').eq('student_id', uid),
    ]);

    myEnrollments = enrollments.map(e=>({
      id:e.id, teacherId:e.teacher_id, teacherName: e.teacher_profiles?.profiles?.full_name || 'Teacher',
      subject:e.subject, schedule:e.schedule, fee:e.fee, status:e.status, dueDate:e.due_date || '—',
    }));
    myPayments = payments;
    myReviews = reviews;
    studentDataStatus = 'ready';
  }catch(err){
    console.error('Failed to load student dashboard data', err);
    studentDataStatus = 'error';
  }
  render();
}

async function ensureTeacherData(force){
  if(!state.session || state.profile?.role!=='teacher') return;
  if(teacherDataStatus==='ready' && !force) return;
  teacherDataStatus = 'loading';
  try{
    const uid = state.session.user.id;
    const [{data, error}, {data:enquiries, error:eqErr}] = await Promise.all([
      sb.from('enrollments').select('*, profiles(full_name)').eq('teacher_id', uid).order('created_at',{ascending:false}),
      sb.from('enquiries').select('*, profiles(full_name)').eq('teacher_id', uid).order('created_at',{ascending:false}),
    ]);
    if(error) throw error;
    if(eqErr) throw eqErr;
    myStudents = data.map(e=>({
      enrollmentId:e.id, studentId:e.student_id, name: e.profiles?.full_name || 'Student',
      grade:e.grade || '—', subject:e.subject, feeStatus:e.status, fee:e.fee, schedule:e.schedule,
    }));
    myEnquiries = enquiries.map(q=>({
      id:q.id, studentId:q.student_id, name: q.profiles?.full_name || 'A parent',
      message:q.message, createdAt:q.created_at,
    }));
    teacherDataStatus = 'ready';
  }catch(err){
    console.error('Failed to load teacher dashboard data', err);
    teacherDataStatus = 'error';
  }
  render();
}

async function ensureTeacherReviews(teacherId, force){
  if(teacherReviewsForId===teacherId && teacherReviewsStatus==='ready' && !force) return;
  teacherReviewsForId = teacherId;
  teacherReviewsStatus = 'loading';
  try{
    const { data, error } = await sb.from('reviews').select('rating, comment, created_at, profiles(full_name)').eq('teacher_id', teacherId).order('created_at',{ascending:false}).limit(30);
    if(error) throw error;
    teacherReviews = data;
    teacherReviewsStatus = 'ready';
  }catch(err){
    console.error('Failed to load reviews', err);
    teacherReviewsStatus = 'error';
  }
  render();
}

// Loads every profile for the admin panel. Deliberately two plain queries
// (rather than an embedded join) merged client-side, so it works the same
// regardless of PostgREST's embed direction for the profiles<->teacher_profiles
// relationship. RLS still applies: 'profiles' and 'teacher_profiles' are
// both publicly readable, so this works whether or not the viewer is an admin —
// it's the delete action below that's actually gated (see schema.sql).
async function ensureAdminData(force){
  if(!state.session || state.profile?.role!=='admin') return;
  if(adminDataStatus==='ready' && !force) return;
  adminDataStatus = 'loading';
  try{
    const [{data:profiles, error}, {data:teacherRows, error:tErr}] = await Promise.all([
      sb.from('profiles').select('*').order('created_at',{ascending:false}),
      sb.from('teacher_profiles').select('profile_id, category, subjects, fee_start, fee_unit, rating, reviews'),
    ]);
    if(error) throw error;
    if(tErr) throw tErr;
    const teacherById = {};
    teacherRows.forEach(t=>{ teacherById[t.profile_id] = t; });
    ADMIN_STUDENTS = profiles.filter(p=>p.role==='student');
    ADMIN_TEACHERS = profiles.filter(p=>p.role==='teacher').map(p=>({ ...p, listing: teacherById[p.id] || null }));
    adminDataStatus = 'ready';
  }catch(err){
    console.error('Failed to load admin data', err);
    adminDataStatus = 'error';
  }
  render();
}

========================================================= */
function filteredTeachers(){
  const f = state.filters;
  const list = TEACHERS.filter(t=>{
    if(f.category!=='all' && t.category!==f.category) return false;
    if(f.query && !(t.name.toLowerCase().includes(f.query.toLowerCase()) || t.subjects.join(' ').toLowerCase().includes(f.query.toLowerCase()))) return false;
    return true;
  });
  if(f.sortDistance && state.myLocation){
    // Nearest to farthest. Teachers without saved coordinates have no
    // known distance, so they're pushed to the end rather than dropped.
    list.sort((a,b)=>{
      const da = distanceKmToTeacher(a), db = distanceKmToTeacher(b);
      if(da==null && db==null) return 0;
      if(da==null) return 1;
      if(db==null) return -1;
      return da - db;
    });
  }
  return list;
}

// Forgot-password flow: step 1 collects the email and asks Supabase to
// email a 6-digit code; step 2 collects that code plus a new password.
// fpEmail is remembered between the two steps (and for "Resend code")
// without needing to touch the main app state.
let fpEmail = '';
// Lets the already-logged-in admin change their own password from the
// admin panel, without needing README "Part 7" or a Supabase dashboard
// visit. Asks for the current password first (re-checked against Supabase
// via signInWithPassword) so someone who walks up to an already-open
// browser tab can't silently take over the account.
function adminChangePasswordModal(){
  return `<div class="glass modal">
    <h3 style="font-size:18px; margin-bottom:4px;">Change admin password</h3>
    <p class="muted" style="font-size:13px; margin-bottom:18px;">This updates the real password Supabase checks for the admin account.</p>
    <div class="field"><label class="field-label">Current password</label><input class="input" id="acpCurrent" type="password" placeholder="••••••••"/></div>
    <div class="field"><label class="field-label">New password</label><input class="input" id="acpNew" type="password" placeholder="••••••••"/></div>
    <div class="field"><label class="field-label">Confirm new password</label><input class="input" id="acpConfirm" type="password" placeholder="••••••••"/></div>
    <div style="display:flex; gap:10px; margin-top:6px;">
      <button class="btn btn-ghost btn-block" data-action="close-modal">Cancel</button>
      <button class="btn btn-primary btn-block" data-action="admin-change-password-confirm">Update password</button>
    </div>
  </div>`;
}

async function changeAdminPassword(currentPassword, newPassword, confirmPassword){
  if(!currentPassword || !newPassword || !confirmPassword) return toast('Please fill in all fields', 'warn');
  if(newPassword.length < 6) return toast('Password must be at least 6 characters', 'warn');
  if(newPassword !== confirmPassword) return toast("New passwords don't match", 'warn');
  // Re-verify the current password before changing anything — this call
  // itself doesn't disturb the existing admin session on success (Supabase
  // just re-confirms the same account), and fails cleanly if it's wrong.
  const { error: verifyError } = await sb.auth.signInWithPassword({ email: ADMIN_EMAIL, password: currentPassword });
  if(verifyError) return toast('❌ Current password is incorrect', 'err');
  const { error: updateError } = await sb.auth.updateUser({ password: newPassword });
  if(updateError) return toast('❌ ' + updateError.message, 'err');
  closeModal();
  toast('✅ Admin password updated', 'ok');
}

const NEEDS_TEACHERS = new Set(['home','browse','teacherProfile']);

function render(){
  if(!isConfigured()){ document.getElementById('app').innerHTML = setupMissingScreen(); return; }
  if(state.session && awaitingOAuthName){
    document.getElementById('app').innerHTML = viewOAuthNamePrompt();
    return;
  }
  const views = {
    home: viewHome, browse: viewBrowse, teacherProfile: viewTeacherProfile,
    studentAuth: viewStudentAuth, studentDashboard: viewStudentDashboard,
    teacherHome: viewTeacherHome, teacherAuth: viewTeacherAuth, teacherDashboard: viewTeacherDashboard,
    teacherOnboarding: viewTeacherOnboarding,
    adminAuth: viewAdminAuth, adminDashboard: viewAdminDashboard,
  };
  let html;
  if(NEEDS_TEACHERS.has(state.view) && teachersStatus !== 'ready'){
    html = navbar() + (teachersStatus === 'error' ? errorScreen('teachers') : loadingScreen('teachers'));
  }else if(state.view==='studentDashboard' && state.session && state.profile?.role==='student' && studentDataStatus==='idle'){
    ensureStudentData(); // status was reset (e.g. by a background auth refresh) — refetch instead of showing a permanent loader
    html = navbar() + loadingScreen('your dashboard');
  }else if(state.view==='teacherDashboard' && state.session && state.profile?.role==='teacher' && teacherDataStatus==='idle'){
    ensureTeacherData();
    html = navbar() + loadingScreen('your dashboard');
  }else if(state.view==='adminDashboard' && state.session && state.profile?.role==='admin' && adminDataStatus==='idle'){
    ensureAdminData();
    html = navbar() + loadingScreen('the admin panel');
  }else{
    html = views[state.view]();
  }
  document.getElementById('app').innerHTML = html;
}

document.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  switch(action){
    case 'go-home':
      nav(state.portal==='customer' ? 'home' : 'teacherHome'); break;
    case 'go':
      if(el.dataset.mode && el.dataset.view==='teacherAuth') state.teacherAuthMode = el.dataset.mode;
      if(el.dataset.mode && el.dataset.view==='studentAuth') state.studentAuthMode = el.dataset.mode;
      if(el.dataset.view==='studentAuth' || el.dataset.view==='teacherAuth') captureAuthRedirect();
      nav(el.dataset.view); break;
    case 'switch-portal':
      state.portal = el.dataset.portal;
      nav(state.portal==='customer' ? 'home' : (state.session && state.profile?.role==='teacher' ? 'teacherDashboard' : 'teacherHome'));
      break;
    case 'go-admin':
      nav(state.session && state.profile?.role==='admin' ? 'adminDashboard' : 'adminAuth');
      break;
    case 'login-admin':
      setBtnLoading(el, true);
      signInAdmin(document.getElementById('adUsername').value, document.getElementById('adPassword').value).finally(()=>setBtnLoading(el, false));
      break;
    case 'forgot-password':
      fpEmail = '';
      openModal(forgotPasswordModal('request'));
      break;
    case 'forgot-password-send':
      setBtnLoading(el, true);
      requestPasswordReset(document.getElementById('fpEmail').value.trim()).finally(()=>setBtnLoading(el, false));
      break;
    case 'forgot-password-resend':
      setBtnLoading(el, true);
      requestPasswordReset(fpEmail).finally(()=>setBtnLoading(el, false));
      break;
    case 'forgot-password-back':
      openModal(forgotPasswordModal('request'));
      break;
    case 'forgot-password-signup':
      closeModal();
      if(state.portal==='teacher'){ state.teacherAuthMode = 'signup'; nav('teacherAuth'); }
      else{ state.studentAuthMode = 'signup'; nav('studentAuth'); }
      break;
    case 'forgot-password-confirm':
      setBtnLoading(el, true);
      confirmPasswordReset(
        document.getElementById('fpCode').value.trim(),
        document.getElementById('fpNewPassword').value,
        document.getElementById('fpConfirmPassword').value
      ).finally(()=>setBtnLoading(el, false));
      break;
    case 'admin-change-password':
      openModal(adminChangePasswordModal());
      break;
    case 'admin-change-password-confirm':
      setBtnLoading(el, true);
      changeAdminPassword(
        document.getElementById('acpCurrent').value,
        document.getElementById('acpNew').value,
        document.getElementById('acpConfirm').value
      ).finally(()=>setBtnLoading(el, false));
      break;
    case 'admin-tab':
      state.adminTab = el.dataset.tab;
      render();
      break;
    case 'admin-delete-profile': {
      const name = el.dataset.name, role = el.dataset.role, id = el.dataset.id;
      if(!confirm(`Delete ${role} "${name}"? This permanently removes their login and all related data (listings, enrollments, payments, reviews). This cannot be undone.`)) return;
      setBtnLoading(el, true);
      // Calls the admin-delete-user Edge Function, which deletes the
      // Supabase Auth account itself (not just the profiles row). That
      // auth deletion cascades down to profiles and everything tied to
      // it, so the user is fully gone, not just logged-out-and-orphaned.
      sb.functions.invoke('admin-delete-user', { body: { id } }).then(({data, error})=>{
        if(error){ toast('❌ ' + error.message, 'err'); return; }
        if(data?.error){ toast('❌ ' + data.error, 'err'); return; }
        toast('🗑️ Removed ' + name, 'ok');
        adminDataStatus = 'idle';
        ensureAdminData();
        teachersStatus = 'idle'; // the removed teacher may be cached in the public listing too
      }).finally(()=>setBtnLoading(el, false));
      break;
    }
    case 'register-as-teacher':
      state.portal = 'teacher';
      if(state.session && state.profile?.role==='teacher'){
        nav('teacherDashboard');
      }else{
        state.teacherAuthMode = 'signup';
        nav('teacherAuth');
      }
      break;
    case 'filter-cat':
      state.filters.category = el.dataset.cat;
      nav('browse');
      break;
    case 'set-filter-cat':
      state.filters.category = el.dataset.cat;
      render();
      break;
    case 'toggle-sort-distance':
      state.filters.sortDistance = !state.filters.sortDistance;
      render();
      break;
    case 'search-from-hero':
      state.filters.query = document.getElementById('heroSearch').value;
      nav('browse');
      break;
    case 'view-teacher':
      nav('teacherProfile', {selectedTeacherId: el.dataset.id, selectedTeacherFrom: state.view==='browse' ? 'browse' : 'home'});
      break;
    case 'open-enquiry':
      if(!state.session || state.profile?.role!=='student'){
        captureAuthRedirect({ reopenEnquiryFor: el.dataset.id });
        toast('Please log in as a parent/student first', 'warn');
        nav('studentAuth');
        return;
      }
      openModal(enquiryModal(el.dataset.id));
      break;
    case 'close-modal':
      // el is whichever ancestor carries data-action="close-modal" — that's
      // only ever the backdrop itself (buttons inside the modal have their
      // own data-action). Only close if the click landed on that element
      // directly, so clicking inside the modal box doesn't dismiss it.
      if(e.target === el) closeModal();
      break;
    case 'send-enquiry': {
      const msg = document.getElementById('enquiryMsg').value;
      setBtnLoading(el, true);
      sb.from('enquiries').insert({ teacher_id: el.dataset.id, student_id: state.session.user.id, message: msg })
        .then(({error})=>{
          if(error){ toast('❌ ' + error.message, 'err'); return; }
          closeModal();
          toast('✅ Enquiry sent to ' + el.dataset.name + '!', 'ok');
        }).finally(()=>setBtnLoading(el, false));
      break;
    }
    case 'enroll-now': {
      const t = TEACHERS.find(x=>x.id===el.dataset.id);
      if(!state.session || state.profile?.role!=='student'){
        // Remember where they were trying to enroll so we can send them
        // straight back here once they've logged in.
        captureAuthRedirect();
        toast('Please log in as a parent/student first', 'warn');
        nav('studentAuth');
        return;
      }
      setBtnLoading(el, true);
      sb.from('enrollments').insert({
        student_id: state.session.user.id, teacher_id: t.id, subject: t.subjects[0]||'General',
        schedule: (t.schedule[0] ? `${t.schedule[0].day} ${t.schedule[0].time}` : ''), fee: t.feeStart, status:'due',
      }).then(({error})=>{
        if(error){ toast('❌ ' + error.message, 'err'); return; }
        toast('✅ Enrolled with ' + t.name + '!', 'ok');
        studentDataStatus = 'idle';
        nav('studentDashboard');
      }).finally(()=>setBtnLoading(el, false));
      break;
    }
    case 'student-auth-mode':
      state.studentAuthMode = el.dataset.mode; render(); break;
    case 'teacher-auth-mode':
      state.teacherAuthMode = el.dataset.mode; render(); break;
    case 'oauth-name-confirm':
      setBtnLoading(el, true);
      completeOAuthSignup(document.getElementById('oauthName').value).finally(()=>setBtnLoading(el, false));
      break;
    case 'google-signin-student':
      setBtnLoading(el, true);
      captureAuthRedirect();
      signInWithGoogle('student').finally(()=>setBtnLoading(el, false));
      break;
    case 'google-signin-teacher':
      setBtnLoading(el, true);
      captureAuthRedirect();
      signInWithGoogle('teacher').finally(()=>setBtnLoading(el, false));
      break;
    case 'login-student':
      setBtnLoading(el, true);
      signInStudent(document.getElementById('suEmail').value, document.getElementById('suPassword').value).finally(()=>setBtnLoading(el, false));
      break;
    case 'signup-student':
      setBtnLoading(el, true);
      signUpStudent(document.getElementById('suName').value, document.getElementById('suEmail').value, document.getElementById('suPassword').value).finally(()=>setBtnLoading(el, false));
      break;
    case 'login-teacher':
      setBtnLoading(el, true);
      signInTeacher(document.getElementById('tuEmail').value, document.getElementById('tuPassword').value).finally(()=>setBtnLoading(el, false));
      break;
    case 'signup-teacher':
      setBtnLoading(el, true);
      signUpTeacher(document.getElementById('tuName').value, document.getElementById('tuEmail').value, document.getElementById('tuPassword').value).finally(()=>setBtnLoading(el, false));
      break;
    case 'logout':
      setBtnLoading(el, true);
      logout().finally(()=>setBtnLoading(el, false));
      break;
    case 'toggle-theme':
      toggleTheme(el);
      break;
    case 'teacher-tab':
      state.teacherTab = el.dataset.tab;
      if(el.dataset.tab==='profile') loadOwnTeacherProfile();
      else render();
      break;
    case 'copy-profile-link': {
      const link = location.origin + location.pathname + '?teacher=' + state.session.user.id;
      navigator.clipboard.writeText(link).then(()=>toast('🔗 Link copied to clipboard', 'ok'));
      break;
    }
    case 'save-profile':
      setBtnLoading(el, true);
      saveTeacherProfile().finally(()=>setBtnLoading(el, false));
      break;
    case 'save-profile-onboarding':
      setBtnLoading(el, true);
      saveTeacherProfileOnboarding().finally(()=>setBtnLoading(el, false));
      break;
    case 'skip-onboarding':
      nav('teacherDashboard');
      break;
    case 'use-my-location':
      useMyLocation();
      break;
    case 'onboarding-location-allow':
      useMyLocationOnboarding();
      break;
    case 'onboarding-location-skip':
      try{ localStorage.setItem('npt-location-declined', '1'); }catch(e){}
      closeModal();
      break;
    case 'teacher-set-location': {
      // Updates the DOM directly rather than calling render() — a full
      // re-render would regenerate this form from state.selectedTeacherProfile
      // and discard any other unsaved field edits the teacher has typed.
      if(!navigator.geolocation){ toast('Location isn\'t supported in this browser', 'warn'); break; }
      const btn = el;
      const originalLabel = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Locating…';
      navigator.geolocation.getCurrentPosition(
        (pos)=>{
          const latEl = document.getElementById('peLat');
          const lngEl = document.getElementById('peLng');
          const statusEl = document.getElementById('peLocStatus');
          if(latEl && lngEl){
            latEl.value = pos.coords.latitude;
            lngEl.value = pos.coords.longitude;
          }
          if(statusEl) statusEl.textContent = 'Location set — students will see their distance to you';
          btn.disabled = false;
          btn.textContent = originalLabel;
          toast('📍 Teaching location captured — remember to save changes', 'ok');
        },
        ()=>{
          btn.disabled = false;
          btn.textContent = originalLabel;
          toast('❌ Couldn\'t get your location — check permissions and try again', 'err');
        },
        { enableHighAccuracy:false, timeout:10000 }
      );
      break;
    }
    case 'open-review':
      openModal(reviewModal(parseInt(el.dataset.id)));
      break;
    case 'submit-review': {
      const enrollmentId = parseInt(el.dataset.enrollment);
      const teacherId = el.dataset.teacher;
      const rating = parseInt(document.getElementById('reviewRating').value);
      const comment = document.getElementById('reviewComment').value.trim();
      setBtnLoading(el, true);
      sb.from('reviews').upsert({
        teacher_id: teacherId, student_id: state.session.user.id, enrollment_id: enrollmentId,
        rating, comment,
      }, { onConflict: 'enrollment_id' }).then(({error})=>{
        if(error){ toast('❌ ' + error.message, 'err'); return; }
        closeModal();
        toast('✅ Thanks for the review!', 'ok');
        studentDataStatus = 'idle';
        ensureStudentData(true);
        ensureTeachers(true); // refresh the teacher's averaged rating everywhere it's shown
      }).finally(()=>setBtnLoading(el, false));
      break;
    }
    case 'open-pay':
      openModal(payModal());
      break;
    case 'confirm-pay':
      setBtnLoading(el, true);
      confirmPay(document.getElementById('payMethod').value).finally(()=>setBtnLoading(el, false));
      break;
    case 'retry-load': {
      setBtnLoading(el, true);
      const reloads = [ensureTeachers(true)];
      if(state.view==='studentDashboard') reloads.push(ensureStudentData(true));
      if(state.view==='teacherDashboard') reloads.push(ensureTeacherData(true));
      if(state.view==='adminDashboard') reloads.push(ensureAdminData(true));
      Promise.all(reloads).finally(()=>setBtnLoading(el, false));
      break;
    }
  }
});

async function loadOwnTeacherProfile(){
  const { data, error } = await sb.from('teacher_profiles').select('*, schedule_slots(day,time,subj)').eq('profile_id', state.session.user.id).single();
  if(error){ toast('❌ ' + error.message, 'err'); return; }
  state.selectedTeacherProfile = data;
  render();
}

async function saveTeacherProfile(){
  const uid = state.session.user.id;
  const payload = {
    category: document.getElementById('peCategory').value,
    subjects: document.getElementById('peSubjects').value.split(',').map(s=>s.trim()).filter(Boolean),
    location: document.getElementById('peLocation').value,
    maps_link: document.getElementById('peMapsLink').value.trim(),
    lat: document.getElementById('peLat').value ? parseFloat(document.getElementById('peLat').value) : null,
    lng: document.getElementById('peLng').value ? parseFloat(document.getElementById('peLng').value) : null,
    experience: document.getElementById('peExperience').value,
    fee_start: parseInt(document.getElementById('peFee').value) || 0,
    bio: document.getElementById('peBio').value,
  };
  const { error } = await sb.from('teacher_profiles').update(payload).eq('profile_id', uid);
  if(error){ toast('❌ ' + error.message, 'err'); return; }

  const scheduleLines = document.getElementById('peSchedule').value.split('\n').map(l=>l.trim()).filter(Boolean);
  const slots = scheduleLines.map(l=>{
    const [day,time,subj] = l.split('|').map(s=>s.trim());
    return { teacher_id: uid, day, time, subj };
  }).filter(s=>s.day && s.time && s.subj);
  await sb.from('schedule_slots').delete().eq('teacher_id', uid);
  if(slots.length) await sb.from('schedule_slots').insert(slots);

  toast('✅ Profile updated', 'ok');
  ensureTeachers(true);
  loadOwnTeacherProfile();
}

async function confirmPay(method){
  const due = myEnrollments.filter(e=>e.status!=='paid');
  const total = due.reduce((s,e)=>s+e.fee,0);
  for(const e of due){
    await sb.from('enrollments').update({status:'paid'}).eq('id', e.id);
    await sb.from('payments').insert({ enrollment_id:e.id, student_id: state.session.user.id, amount:e.fee, method });
  }
  closeModal();
  toast('✅ Recorded ₹' + total + ' as paid.', 'ok');
  studentDataStatus = 'idle';
  ensureStudentData(true);
}

document.addEventListener('keydown', (e)=>{
  if(e.key !== 'Enter') return;
  const id = e.target.id;
  if(id==='suName' || id==='suEmail' || id==='suPassword'){
    e.preventDefault();
    const btn = document.querySelector('[data-action="login-student"], [data-action="signup-student"]');
    setBtnLoading(btn, true);
    if(state.studentAuthMode==='login'){
      signInStudent(document.getElementById('suEmail').value, document.getElementById('suPassword').value).finally(()=>setBtnLoading(btn, false));
    }else{
      signUpStudent(document.getElementById('suName').value, document.getElementById('suEmail').value, document.getElementById('suPassword').value).finally(()=>setBtnLoading(btn, false));
    }
  }
  if(id==='tuName' || id==='tuEmail' || id==='tuPassword'){
    e.preventDefault();
    const btn = document.querySelector('[data-action="login-teacher"], [data-action="signup-teacher"]');
    setBtnLoading(btn, true);
    if(state.teacherAuthMode==='login'){
      signInTeacher(document.getElementById('tuEmail').value, document.getElementById('tuPassword').value).finally(()=>setBtnLoading(btn, false));
    }else{
      signUpTeacher(document.getElementById('tuName').value, document.getElementById('tuEmail').value, document.getElementById('tuPassword').value).finally(()=>setBtnLoading(btn, false));
    }
  }
  if(id==='adUsername' || id==='adPassword'){
    e.preventDefault();
    const btn = document.querySelector('[data-action="login-admin"]');
    setBtnLoading(btn, true);
    signInAdmin(document.getElementById('adUsername').value, document.getElementById('adPassword').value).finally(()=>setBtnLoading(btn, false));
  }
  if(id==='fpEmail'){
    e.preventDefault();
    const btn = document.querySelector('[data-action="forgot-password-send"]');
    setBtnLoading(btn, true);
    requestPasswordReset(document.getElementById('fpEmail').value.trim()).finally(()=>setBtnLoading(btn, false));
  }
  if(id==='fpCode' || id==='fpNewPassword' || id==='fpConfirmPassword'){
    e.preventDefault();
    const btn = document.querySelector('[data-action="forgot-password-confirm"]');
    setBtnLoading(btn, true);
    confirmPasswordReset(
      document.getElementById('fpCode').value.trim(),
      document.getElementById('fpNewPassword').value,
      document.getElementById('fpConfirmPassword').value
    ).finally(()=>setBtnLoading(btn, false));
  }
  if(id==='oauthName'){
    e.preventDefault();
    const btn = document.querySelector('[data-action="oauth-name-confirm"]');
    setBtnLoading(btn, true);
    completeOAuthSignup(document.getElementById('oauthName').value).finally(()=>setBtnLoading(btn, false));
  }
  if(id==='acpCurrent' || id==='acpNew' || id==='acpConfirm'){
    e.preventDefault();
    const btn = document.querySelector('[data-action="admin-change-password-confirm"]');
    setBtnLoading(btn, true);
    changeAdminPassword(
      document.getElementById('acpCurrent').value,
      document.getElementById('acpNew').value,
      document.getElementById('acpConfirm').value
    ).finally(()=>setBtnLoading(btn, false));
  }
});

boot();
