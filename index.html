:root{
  --bg:#0A0E27;
  --bg2:#12163a;
  --glass: rgba(255,255,255,0.055);
  --glass-hi: rgba(255,255,255,0.09);
  --glass-border: rgba(255,255,255,0.14);
  --text:#F4F2FF;
  --text-dim:#9C97C4;
  --text-dimmer:#716C99;
  --primary:#6C5CE7;
  --primary2:#EC4899;
  --amber:#F5A623;
  --green:#2ECC71;
  --blue:#4FA8F5;
  --pink:#F472B6;
  --red:#FB6A6A;
  --radius:20px;
  --mono: 'JetBrains Mono', monospace;
  --display: 'Fraunces', serif;
  --body: 'Inter', sans-serif;
  /* theme-aware surface tokens (swapped by [data-theme="light"] below) */
  --input-bg: rgba(255,255,255,0.05);

}
:root[data-theme="light"]{
  --bg:#F4F3FA;
  --bg2:#FFFFFF;
  --glass: rgba(30,26,70,0.045);

  --text-dim:#5C5885;

  --scrollbar-thumb: rgba(30,26,70,0.18);
  --shadow-card: rgba(30,26,70,0.16);

  --divider-soft: rgba(30,26,70,0.045);
  --backdrop: rgba(225,224,240,0.75);
  --blob-opacity: 0.22;
  color-scheme: light;
}
*{box-sizing:border-box; margin:0; padding:0;}
html{scroll-behavior:smooth;}

/* ---------------------------------------------------------------
   Theme toggle — simple cross-fade.
   When the browser supports the View Transitions API, toggleTheme()
   calls document.startViewTransition(). That gives us a snapshot of the
   old theme and a snapshot of the new theme stacked on top of each
   other; this just fades the new one in over the old one. Kept to
   opacity only (no clip-path/filter) so there's nothing for the browser
   to resample frame-to-frame. Browsers without support (or people with
   reduced-motion on) just get an instant swap — see the JS fallback in
   toggleTheme().
--------------------------------------------------------------- */
@media (prefers-reduced-motion: no-preference){
  ::view-transition-old(root),
  ::view-transition-new(root){
    animation: none;
    mix-blend-mode: normal;
  }
  ::view-transition-old(root){ z-index: 1; }
  ::view-transition-new(root){
    z-index: 2;
    animation: theme-fade 220ms ease-out;
  }
  @keyframes theme-fade{
    from{ opacity: 0; }
    to{ opacity: 1; }
  }
}


body{
  font-family: var(--body);
  background: var(--bg);
  color: var(--text);
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
  transition: background .3s ease, color .3s ease;
}
::selection{ background: var(--primary); color:#fff; }
::-webkit-scrollbar{ width:10px; }
::-webkit-scrollbar-track{ background: transparent; }
::-webkit-scrollbar-thumb{ background: var(--scrollbar-thumb); border-radius:10px; }

/* ---------- floating gradient blobs ---------- */
.blobs{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
.blob{ position:absolute; border-radius:50%; filter: blur(90px); opacity: var(--blob-opacity); }
.blob1{ width:520px; height:520px; background: radial-gradient(circle, var(--primary), transparent 70%); top:-160px; left:-120px; animation: float1 22s ease-in-out infinite; }
.blob2{ width:460px; height:460px; background: radial-gradient(circle, var(--primary2), transparent 70%); top:20%; right:-160px; animation: float2 26s ease-in-out infinite; }
.blob3{ width:380px; height:380px; background: radial-gradient(circle, var(--blue), transparent 70%); bottom:-140px; left:20%; animation: float3 20s ease-in-out infinite; }
.blob4{ width:300px; height:300px; background: radial-gradient(circle, var(--amber), transparent 70%); bottom:10%; right:15%; opacity:0.28; animation: float1 30s ease-in-out infinite reverse; }
@keyframes float1{ 0%,100%{ transform:translate(0,0) scale(1);} 50%{ transform:translate(60px,80px) scale(1.1);} }
@keyframes float2{ 0%,100%{ transform:translate(0,0) scale(1);} 50%{ transform:translate(-70px,60px) scale(0.9);} }
@keyframes float3{ 0%,100%{ transform:translate(0,0) scale(1);} 50%{ transform:translate(50px,-60px) scale(1.15);} }

#app{ position:relative; z-index:1; min-height:100vh; }

/* ---------- utility ---------- */
.wrap{ max-width:1240px; margin:0 auto; padding:0 28px; }
.glass{
  background: var(--glass);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-radius: var(--radius);
}
.glass:hover{ background: var(--glass-hi); }
h1,h2,h3,h4{ font-family: var(--display); font-weight:600; letter-spacing:-0.01em; }
.eyebrow{ font-family: var(--mono); font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color: var(--text-dim); }
.muted{ color: var(--text-dim); }
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  font-family: var(--body); font-weight:600; font-size:14.5px;
  padding:13px 24px; border-radius:100px; border:none; cursor:pointer;
  transition: transform .25s cubic-bezier(.2,.9,.3,1.3), box-shadow .25s ease, background .25s ease;
  white-space:nowrap;
}
.btn:active{ transform: scale(0.96); }
.btn-primary{ background: linear-gradient(135deg, var(--primary), var(--primary2)); color:#fff; box-shadow: 0 8px 24px -8px rgba(108,92,231,0.7); }
.btn-primary:hover{ transform: translateY(-2px); box-shadow: 0 14px 30px -8px rgba(108,92,231,0.85); }
.btn-ghost{ background: var(--glass); border:1px solid var(--glass-border); color:var(--text); }
.btn-ghost:hover{ background: var(--glass-hi); transform: translateY(-2px); }
.btn-sm{ padding:9px 16px; font-size:13px; }
.btn-block{ width:100%; }
.btn-loading{ position:relative; pointer-events:none; color:transparent !important; }
.btn-loading .btn-spinner{
  position:absolute; top:50%; left:50%; width:16px; height:16px; margin:-8px 0 0 -8px;
  border-radius:50%; border:2px solid rgba(255,255,255,0.4); border-top-color:#fff;
  animation: btn-spin .7s linear infinite;
}
.btn-ghost.btn-loading .btn-spinner{ border-color: rgba(120,120,140,0.35); border-top-color: var(--text); }
@keyframes btn-spin{ to{ transform: rotate(360deg); } }
.pill{ display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:100px; font-size:13px; font-weight:600; border:1px solid var(--glass-border); background:var(--glass); cursor:pointer; transition: all .2s ease; white-space:nowrap;}
.pill:hover{ background: var(--glass-hi); transform: translateY(-1px); }
.pill.active{ background: linear-gradient(135deg, var(--primary), var(--primary2)); border-color:transparent; color:#fff; }
.input{
  width:100%; background: var(--input-bg); border:1px solid var(--glass-border);
  color:var(--text); padding:13px 16px; border-radius:12px; font-family:var(--body); font-size:14px; outline:none;
  transition: border-color .2s ease, background .2s ease;
}
.input:focus{ border-color: var(--primary); background: var(--input-bg-focus); }
.input::placeholder{ color: var(--text-dimmer); }
/* selects render their closed box with our theme, but the browser draws the
   open dropdown list using native OS colors — color-scheme + explicit
   option colors keep that list readable in both themes instead of e.g.
   pale text on a pale popup. */
select.input{ cursor:pointer; }
select.input option{ background: var(--bg2); color: var(--text); }
label.field-label{ display:block; font-size:12.5px; font-weight:600; color:var(--text-dim); margin-bottom:6px; font-family:var(--mono); letter-spacing:0.03em; }
.field{ margin-bottom:16px; }
.badge{ display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:100px; font-size:11.5px; font-weight:700; font-family:var(--mono); letter-spacing:0.02em; }
.badge-green{ background: rgba(46,204,113,0.15); color: var(--green); }
.badge-amber{ background: rgba(245,166,35,0.15); color: var(--amber); }
.badge-red{ background: rgba(251,106,106,0.15); color: var(--red); }
.badge-blue{ background: rgba(79,168,245,0.15); color: var(--blue); }
.card{ transition: transform .3s cubic-bezier(.2,.9,.3,1), box-shadow .3s ease; }
.card:hover{ transform: translateY(-6px); box-shadow: 0 20px 40px -16px var(--shadow-card); }
.fade-in{ animation: fadeIn .5s ease both; }
@keyframes fadeIn{ from{ opacity:0; transform: translateY(14px);} to{ opacity:1; transform:translateY(0);} }
.stagger > *{ animation: fadeIn .5s ease both; }
.stagger > *:nth-child(1){ animation-delay: .02s;} .stagger > *:nth-child(2){ animation-delay: .06s;}
.stagger > *:nth-child(3){ animation-delay: .10s;} .stagger > *:nth-child(4){ animation-delay: .14s;}
.stagger > *:nth-child(5){ animation-delay: .18s;} .stagger > *:nth-child(6){ animation-delay: .22s;}
.stagger > *:nth-child(7){ animation-delay: .26s;} .stagger > *:nth-child(8){ animation-delay: .30s;}
.view-transition{ animation: viewIn .45s cubic-bezier(.2,.9,.3,1) both; }
@keyframes viewIn{ from{ opacity:0; transform: translateY(18px) scale(0.99);} to{ opacity:1; transform:translateY(0) scale(1);} }
@keyframes skeletonPulse{ 0%{opacity:.5} 50%{opacity:1} 100%{opacity:.5} }
.skel{ background:var(--divider-soft); border-radius:10px; animation: skeletonPulse 1.2s ease-in-out infinite; }
.skel-line{ height:13px; border-radius:6px; }
.skel-card{ height:78px; border-radius:16px; }
@keyframes paneIn{ from{ opacity:0; transform: translateY(8px);} to{ opacity:1; transform:translateY(0);} }
.pane-fade{ animation: paneIn .28s ease both; }
a{ color:inherit; text-decoration:none; }
.stars{ display:inline-flex; gap:2px; color: var(--amber); font-size:14px; letter-spacing:1px; }
.divider-dashed{ border:none; border-top:2px dashed var(--scrollbar-thumb); margin:0; }
.avatar{ border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:600; flex-shrink:0; color:#fff; }
.scroll-x{ display:flex; gap:10px; overflow-x:auto; padding-bottom:6px; scrollbar-width:none; }
.scroll-x::-webkit-scrollbar{ display:none; }
.grid-cards{ display:grid; grid-template-columns: repeat(auto-fill, minmax(290px,1fr)); gap:20px; }
.grid-cards-3{ display:grid; grid-template-columns: repeat(3,1fr); gap:20px; }
@media(max-width:860px){ .grid-cards-3{ grid-template-columns: 1fr; } }
@media(min-width:861px) and (max-width:1100px){ .grid-cards-3{ grid-template-columns: repeat(2,1fr); } }
.toast-wrap{ position:fixed; top:20px; right:20px; z-index:999; display:flex; flex-direction:column; gap:10px; }
.toast{ padding:14px 20px; border-radius:14px; font-size:14px; font-weight:600; min-width:260px; animation: toastIn .35s cubic-bezier(.2,.9,.3,1.2) both; display:flex; align-items:center; gap:10px;}
@keyframes toastIn{ from{ opacity:0; transform: translateX(40px);} to{ opacity:1; transform:translateX(0);} }
.modal-backdrop{ position:fixed; inset:0; background:var(--backdrop); backdrop-filter: blur(6px); z-index:200; display:flex; align-items:center; justify-content:center; padding:20px; animation: fadeIn .25s ease both; }
.modal{ width:100%; max-width:460px; max-height:88vh; overflow-y:auto; animation: modalIn .35s cubic-bezier(.2,.9,.3,1.15) both; padding:28px; }
@keyframes modalIn{ from{ opacity:0; transform: translateY(30px) scale(0.96);} to{ opacity:1; transform:translateY(0) scale(1);} }

/* ---------- corner chat widget: collapsed bubble + expanded panel ---------- */
.chat-bubble{
  position:fixed; right:20px; bottom:20px; z-index:250;
  width:56px; height:56px; border-radius:50%;
  background:var(--primary); color:#fff; border:none;
  font-size:23px; display:flex; align-items:center; justify-content:center;
  cursor:pointer; box-shadow:0 10px 28px var(--shadow-card);
  animation: modalIn .3s cubic-bezier(.2,.9,.3,1.15) both;
}
.chat-bubble-badge{
  position:absolute; top:-2px; right:-2px; min-width:20px; height:20px; padding:0 5px;
  border-radius:10px; background:#e63946; color:#fff; font-size:11px; font-weight:800;
  display:flex; align-items:center; justify-content:center; border:2px solid var(--bg2);
}
.chat-dock{
  position:fixed; right:20px; bottom:20px; z-index:250;
  width:340px; max-width:calc(100vw - 32px);
  height:480px; max-height:calc(100vh - 100px);
  display:flex; flex-direction:column; padding:16px;
  box-shadow: 0 16px 44px var(--shadow-card);
  animation: modalIn .3s cubic-bezier(.2,.9,.3,1.15) both;
}
@media (max-width: 480px){
  .chat-dock{ right:10px; left:10px; bottom:10px; width:auto; max-width:none; height:min(480px, calc(100vh - 80px)); }
  .chat-bubble{ right:16px; bottom:16px; }
}
.notif-drawer{
  position:fixed; top:78px; right:20px; z-index:260;
  width:360px; max-width:calc(100vw - 32px);
  max-height:min(520px, calc(100vh - 120px));
  display:flex; flex-direction:column; padding:16px;
  box-shadow: 0 16px 44px var(--shadow-card);
  animation: modalIn .3s cubic-bezier(.2,.9,.3,1.15) both;
  overflow-y:auto;
}
@media (max-width: 480px){
  .notif-drawer{ right:10px; left:10px; width:auto; max-width:none; }
}
.notif-bell{ position:relative; }
.notif-bell-badge{
  position:absolute; top:-4px; right:-6px; min-width:17px; height:17px; padding:0 4px;
  border-radius:9px; background:#e63946; color:#fff; font-size:10.5px; font-weight:800;
  display:flex; align-items:center; justify-content:center; border:2px solid var(--bg2);
}
.chat-msg-reply-btn{
  width:22px; height:22px; border-radius:50%; flex-shrink:0; margin-bottom:18px;
  background:var(--glass); border:1px solid var(--glass-border); color:var(--text-dim);
  display:flex; align-items:center; justify-content:center; font-size:12px; line-height:1;
  cursor:pointer; opacity:0; transition:opacity .15s ease;
}
.chat-msg-row:hover .chat-msg-reply-btn, .chat-msg-row:focus-within .chat-msg-reply-btn{ opacity:1; }
/* Touch devices don't have a real :hover state, so the reply button would
   otherwise stay invisible (and need a "phantom" first tap to reveal it
   before a second tap could actually hit it). Keep it visibly present —
   just a little faded — whenever there's no hover capability at all. */
@media (hover:none){ .chat-msg-reply-btn{ opacity:.55; } }
.chat-msg-reply-btn:active{ opacity:1; }
.chat-msg-highlight{ box-shadow:0 0 0 2px var(--primary) !important; }

/* ticket / class-slip signature element */
.ticket{
  position:relative; display:flex; align-items:stretch; border-radius:16px; overflow:hidden;
  background: var(--glass); border:1px solid var(--glass-border);
}
.ticket-stub{ width:86px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:var(--mono); position:relative; }
.ticket-stub .t-day{ font-size:11px; letter-spacing:0.08em; opacity:0.85; }
.ticket-stub .t-time{ font-size:13px; font-weight:700; margin-top:4px; text-align:center; }
.ticket-perf{ width:0; border-left:2px dashed var(--glass-border); position:relative; }
.ticket-perf::before, .ticket-perf::after{ content:''; position:absolute; width:14px; height:14px; background:var(--bg); border-radius:50%; left:-8px; }
.ticket-perf::before{ top:-7px; } .ticket-perf::after{ bottom:-7px; }
.ticket-body{ flex:1; padding:14px 18px; }

/* navbar */
.nav{ position:sticky; top:0; z-index:100; padding:16px 0; }
.nav-inner{ display:flex; align-items:center; justify-content:space-between; padding:12px 20px; }
.logo{ display:flex; align-items:center; gap:10px; font-family:var(--display); font-weight:700; font-size:19px; }
.logo-mark{ width:34px; height:34px; border-radius:10px; background: linear-gradient(135deg, var(--primary), var(--primary2)); display:flex; align-items:center; justify-content:center; font-size:16px; }
.nav-links{ display:flex; gap:4px; align-items:center; }
.nav-links a, .nav-links button{ background:none; border:none; color:var(--text-dim); font-weight:600; font-size:14px; padding:9px 14px; border-radius:100px; cursor:pointer; transition: all .2s ease; font-family:var(--body); }
.nav-links a:hover, .nav-links button:hover{ color:var(--text); background: var(--glass); }

/* calendar */
.cal-grid{ display:grid; grid-template-columns: repeat(7, 1fr); gap:8px; }
.cal-head{ font-family:var(--mono); font-size:11px; text-align:center; color:var(--text-dimmer); padding-bottom:4px; }
.cal-cell{ aspect-ratio:1; border-radius:10px; background: var(--divider-soft); border:1px solid var(--divider); display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:12.5px; position:relative; }
.cal-cell.has-class{ background: rgba(108,92,231,0.18); border-color: rgba(108,92,231,0.4); }
.cal-cell .dot{ width:5px; height:5px; border-radius:50%; background: var(--primary2); position:absolute; bottom:5px; }

table.data-table{ width:100%; border-collapse:collapse; font-size:13.5px; }
table.data-table th{ text-align:left; font-family:var(--mono); font-size:11px; letter-spacing:0.04em; text-transform:uppercase; color:var(--text-dimmer); padding:10px 12px; border-bottom:1px solid var(--glass-border); }
table.data-table td{ padding:12px; border-bottom:1px solid var(--divider-soft); }
table.data-table tr:hover td{ background: var(--divider-soft); }

.sidebar-link{ display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:12px; color:var(--text-dim); font-weight:600; font-size:14px; cursor:pointer; transition: all .2s ease; }
.sidebar-link:hover{ background: var(--glass); color:var(--text); }
.sidebar-link.active{ background: linear-gradient(135deg, rgba(108,92,231,0.25), rgba(236,73,153,0.2)); color:#fff; border:1px solid rgba(108,92,231,0.4); }

.stat-card{ padding:20px; }
.stat-num{ font-family:var(--display); font-size:32px; font-weight:600; margin-top:4px; }

@media(max-width:860px){
  .nav-links{ display:none; }
  .hide-mobile{ display:none; }
  .grid-2{ grid-template-columns:1fr !important; }
  .dash-layout{ grid-template-columns:1fr !important; }
}
.grid-2{ display:grid; grid-template-columns: 1.6fr 1fr; gap:24px; }
.dash-layout{ display:grid; grid-template-columns: 220px 1fr; gap:24px; align-items:start; }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}
</style>

<script>
// Apply the saved (or OS-preferred) theme immediately, before anything
// renders, so the page never flashes the wrong theme on load.
(function(){
  try{
    var saved = localStorage.getItem('npt-theme');
    var theme = saved || ((window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', theme);
  }catch(e){ document.documentElement.setAttribute('data-theme', 'dark'); }
})();
</script>

// Great-circle distance between two lat/lng points, in km (Haversine formula).
function haversineKm(lat1, lng1, lat2, lng2){
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI/180;
  const dLng = (lng2 - lng1) * Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// Raw distance in km from the browsing person to a teacher, or null if
// either side's coordinates aren't known yet. Used for sorting.
function distanceKmToTeacher(t){
  if(!state.myLocation || t.lat==null || t.lng==null) return null;
  return haversineKm(state.myLocation.lat, state.myLocation.lng, t.lat, t.lng);
}

}

/* =========================================================
   ROUTING — gives every view a real URL (via the hash, so it
   still works on a static host like GitHub Pages with no
   server-side rewrites needed). This means:
   - Refreshing the page reopens the same screen instead of
     bouncing back to the homepage.
   - Chrome's back/forward buttons move between screens.
   - Links can be shared/bookmarked to a specific page.
========================================================= */
const VIEW_ROUTES = {
  home: '/', browse: '/browse',
  studentAuth: '/parents/login', studentDashboard: '/parents/dashboard',
  teacherHome: '/teachers', teacherAuth: '/teachers/login',
  teacherDashboard: '/teachers/dashboard', teacherOnboarding: '/teachers/onboarding',
  adminAuth: '/admin/login', adminDashboard: '/admin/dashboard',
};
let ignoreNextHashChange = false;
const UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

function slugify(str){
  return (str||'').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/(^-+|-+$)/g,'');
}
// Same-named teachers get numbered in a stable order (by id) so the same
// teacher always resolves to the same number, regardless of query order.
function teachersWithSlug(slug){
  return TEACHERS.filter(t => slugify(t.name)===slug).sort((a,b)=> a.id.localeCompare(b.id));
}

function hashForView(view, st){
  if(view==='teacherProfile'){
    const t = TEACHERS.find(x => x.id === st.selectedTeacherId);
    if(!t) return '#/teacher/' + encodeURIComponent(st.selectedTeacherId || ''); // teacher list not loaded yet
    const slug = slugify(t.name) || 'teacher';
    const dupes = teachersWithSlug(slug);
    if(dupes.length <= 1) return '#/teacher/' + encodeURIComponent(slug);
    const idx = dupes.findIndex(x=>x.id===t.id) + 1;
    return '#/teacher/' + encodeURIComponent(slug) + '/' + idx;
  }
  return '#' + (VIEW_ROUTES[view] || '/');
}
function viewFromHash(hash){
  const path = (hash||'').replace(/^#/, '') || '/';
  if(path.startsWith('/teacher/')){
    // may be a full uuid (older links), "ritu-sharma", or "ritu-sharma/2"
    // — resolved once the teacher list has loaded, see resolvePendingTeacherSlug()
    return { view:'teacherProfile', selectedTeacherId: decodeURIComponent(path.slice('/teacher/'.length).replace(/\/$/,'')) };
  }
  const found = Object.keys(VIEW_ROUTES).find(k => VIEW_ROUTES[k]===path);
  return { view: found || 'home' };
}
function setHash(view, st){
  const target = hashForView(view, st);
  if(location.hash === target) return;
  ignoreNextHashChange = true;
  location.hash = target;
}
// Once TEACHERS has loaded, turns a slug (or an older raw-uuid link) in the
// URL into the real teacher id, rewrites the address bar to the pretty
// slug form, and loads that teacher's reviews. Bounces to Browse if
// nothing matches.
function resolvePendingTeacherSlug(){
  if(state.view !== 'teacherProfile' || !state.selectedTeacherId) return;
  if(UUID_RE.test(state.selectedTeacherId)){
    setHash('teacherProfile', state); // normalize old raw-uuid links to the pretty slug
    ensureTeacherReviews(state.selectedTeacherId);
    return;
  }
  if(TEACHERS.some(t => t.id === state.selectedTeacherId)){
    ensureTeacherReviews(state.selectedTeacherId);
    return;
  }
  const [slugPart, idxPart] = state.selectedTeacherId.split('/');
  const dupes = teachersWithSlug(slugPart);
  let found = null;
  if(dupes.length === 1) found = dupes[0];
  else if(dupes.length > 1) found = dupes[(idxPart ? parseInt(idxPart,10) : 1) - 1] || dupes[0];
  if(found){
    state.selectedTeacherId = found.id;
    setHash('teacherProfile', state);
    ensureTeacherReviews(found.id);
  }else{
    state.view = 'browse';
    setHash('browse', state);
  }
}
// Fires on the browser's back/forward buttons, and on any manual hash edit.
window.addEventListener('hashchange', ()=>{
  if(ignoreNextHashChange){ ignoreNextHashChange = false; return; }
  const parsed = viewFromHash(location.hash);
  const extra = parsed.selectedTeacherId ? {selectedTeacherId: parsed.selectedTeacherId, selectedTeacherFrom:'home'} : null;
  nav(parsed.view, extra, {fromHash:true});
});


function nav(view, extra, opts){

function currentTheme(){ return document.documentElement.getAttribute('data-theme') || 'dark'; }

function toggleTheme(btn){
  const next = currentTheme()==='dark' ? 'light' : 'dark';

    try{ localStorage.setItem('npt-theme', next); }catch(e){}

  };

  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canAnimate = document.startViewTransition && !reduceMotion;
  if(!canAnimate){ applyTheme(); return; }

  document.startViewTransition(applyTheme);
}

// Escapes text before dropping it into innerHTML — used for chat message
// bodies, since those are free-typed by whoever's on the other end and
// must never be interpreted as HTML.
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

// Coarse "how long ago" for last-seen display — doesn't need to be precise.
function relativeTime(iso){
  if(!iso) return '';
  const mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins / 60);
  if(hrs < 24) return hrs + 'h ago';
  const days = Math.floor(hrs / 24);
  if(days < 7) return days + 'd ago';
  return new Date(iso).toLocaleDateString(undefined, {day:'numeric', month:'short'});
}

// onClick is optional — when passed (e.g. the incoming-message toast), the
// whole toast becomes tappable, and tapping it runs onClick (jumps to the
// relevant chat thread) then dismisses the toast right away.
function toast(msg, type, onClick){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  const colors = {ok:'linear-gradient(135deg,#2ECC71,#27ae60)', info:'linear-gradient(135deg,#6C5CE7,#EC4899)', warn:'linear-gradient(135deg,#F5A623,#e67e22)', err:'linear-gradient(135deg,#FB6A6A,#c0392b)'};
  el.className = 'toast';
  el.style.background = colors[type||'info'];
  el.style.color = '#fff';
  el.innerHTML = msg;
  if(onClick){
    el.style.cursor = 'pointer';
    el.addEventListener('click', ()=>{
      onClick();
      el.style.transition='opacity .2s ease, transform .2s ease'; el.style.opacity='0'; el.style.transform='translateX(40px)';
      setTimeout(()=>el.remove(),200);
    });
  }
  wrap.appendChild(el);
  setTimeout(()=>{ if(!el.isConnected) return; el.style.transition='opacity .4s ease, transform .4s ease'; el.style.opacity='0'; el.style.transform='translateX(40px)'; setTimeout(()=>el.remove(),400); }, 3200);
}

// Puts a button into/out of a spinning "buffering" state while an async
// auth call is in flight, so there's no awkward static gap before the
// next screen appears. Safe to call even if the view has already been
// re-rendered out from under the original button (e.g. after a
// successful login swaps the whole page) — the .finally() just no-ops
// on a detached element.
function setBtnLoading(btn, loading){
  if(!btn) return;
  if(loading){
    if(btn.querySelector('.btn-spinner')) return; // already loading
    btn.classList.add('btn-loading');
    btn.disabled = true;
    const spin = document.createElement('span');
    spin.className = 'btn-spinner';
    btn.appendChild(spin);
  }else{
    btn.classList.remove('btn-loading');
    btn.disabled = false;
    const spin = btn.querySelector('.btn-spinner');
    if(spin) spin.remove();
  }
}

function starString(rating){
  const full = Math.round(rating||0);
  return '★'.repeat(full) + '☆'.repeat(5-full);
}
// Maps a 1–5 rating to a color along a red → amber → green gradient, so
// low ratings read as a warning and high ratings read as a strong
// positive, with a smooth blend in between. 0/no rating stays neutral.
function ratingColor(rating){
  if(!rating) return 'var(--text-dimmer)';
  const clamped = Math.max(1, Math.min(5, rating));
  const hue = (clamped - 1) / 4 * 120; // 1★=0 (red) … 5★=120 (green)
  return `hsl(${hue.toFixed(0)}, 72%, 50%)`;
}
// Translucent background version of ratingColor(), for badge fills.
function ratingColorBg(rating){
  if(!rating) return 'transparent';
  const clamped = Math.max(1, Math.min(5, rating));
  const hue = (clamped - 1) / 4 * 120;
  return `hsla(${hue.toFixed(0)}, 72%, 50%, 0.15)`;
}
// Small inline badge for teacher cards — shows "New" instead of a fake
// star rating for teachers who don't have any reviews yet.
function ratingBadgeSmall(t){
  if(!t.reviews) return `<div class="badge badge-blue">🆕 New</div>`;
  return `<div class="badge" style="background:${ratingColorBg(t.rating)}; color:${ratingColor(t.rating)};">${starString(t.rating)[0]} ${t.rating}</div>`;
}

   SUPABASE — AUTH
========================================================= */
function isConfigured(){ return !!sb; }

// True the moment refreshProfile() finds a signed-in Google user with no
// profiles row yet — i.e. their very first "Continue with Google" sign-in.
// render() checks this to show the name-entry screen instead of routing
// them anywhere else, until completeOAuthSignup() below resolves it.
let awaitingOAuthName = false;
// The role (student/teacher) they intended, read out of localStorage the
// moment we detect awaitingOAuthName — stashed there right before the
// redirect to Google by signInWithGoogle(), since Google itself has no
// notion of "student vs teacher".
let oauthPendingRole = 'student';

async function refreshProfile(){
  if(!state.session){ state.profile = null; awaitingOAuthName = false; return; }
  const { data, error } = await sb.from('profiles').select('*').eq('id', state.session.user.id).single();
  if(!error){ state.profile = data; awaitingOAuthName = false; return; }
  if(error.code !== 'PGRST116'){ console.error(error); state.profile = null; awaitingOAuthName = false; return; }
  // PGRST116 = no matching row. Email/password sign-up always creates its
  // own profiles row right after auth.signUp() (see signUpStudent/
  // signUpTeacher below), so reaching here means a Google sign-in that
  // hasn't been given a name yet — don't guess it from their Google

let lastAuthUserId = null;
// Supabase fires SIGNED_IN on onAuthStateChange as soon as signUp()/
// signInWithPassword() resolves internally — which lands *before* our own
// signUpStudent/signInStudent/etc functions below finish their own
// refreshProfile() + nav(). Without this flag, that listener's render()
// briefly repaints the still-open auth dialog (now with a session but the
// old view) right before nav() switches to the dashboard, which looks like
// the dialog "reloading" for a moment. The explicit flows set this while
// they're mid-flight so the listener updates state silently and lets the
// explicit flow's own nav()/render() do the (single) visible transition.
let authFlowInProgress = false;

async function boot(){
  if(!isConfigured()){ render(); return; }

  sb.auth.onAuthStateChange(async (event, session)=>{
    state.session = session;
    // Supabase fires this on token refresh, tab focus, etc — not just on
    // actual login/logout. Only wipe cached dashboard data when the
    // signed-in user id has genuinely changed, otherwise a dashboard
    // that's already loaded gets reset to "loading" and never refetches.
    const newUserId = session?.user?.id || null;
    const userChanged = newUserId !== lastAuthUserId;
    if(userChanged){
      await refreshProfile();
      studentDataStatus = 'idle'; teacherDataStatus = 'idle'; adminDataStatus = 'idle';
      resetChatWidget();
      lastAuthUserId = newUserId;
    }
    if(authFlowInProgress) return;
    // A TOKEN_REFRESHED event fires on basically every tab focus, with the
    // same signed-in user and nothing actually different — repainting on
    // every one of those wipes out in-progress form input (fields aren't
    // bound to state) and resets the chat widget's scroll position. Only
    // repaint when the signed-in user actually changed, or on an explicit
    // sign-out — state.session above is still kept fresh either way, so API
    // calls still use the refreshed token.
    if(userChanged || event === 'SIGNED_OUT') render();
  });

  await Promise.all([
    (async()=>{
      const { data:{ session } } = await sb.auth.getSession();
      state.session = session;
      lastAuthUserId = session?.user?.id || null;
      await refreshProfile();
    })(),
    ensureMaintenanceStatus(), // fetched alongside the session so the first paint doesn't flash the full site before flipping to the maintenance page
  ]);
  subscribeMaintenanceRealtime();

  // support ?teacher=<id> deep links (e.g. shared from a teacher's dashboard)
  const params = new URLSearchParams(location.search);
  const sharedTeacher = params.get('teacher');
  if(sharedTeacher){
    state.view = 'teacherProfile'; state.selectedTeacherId = sharedTeacher; state.selectedTeacherFrom = 'home';
    setHash('teacherProfile', state);
  }else if(location.hash){
    // restores whichever screen was open before a refresh, and is also
    // what a shared/bookmarked link like #/teacher/<id> opens directly to
    const parsed = viewFromHash(location.hash);
    state.view = parsed.view;
    if(parsed.selectedTeacherId){ state.selectedTeacherId = parsed.selectedTeacherId; state.selectedTeacherFrom = 'home'; }
  }else{
    // no hash yet on first-ever visit — write one so refresh/back stay in sync from here on
    setHash(state.view, state);
  }

  ensureTeachers();
  render();

  // Ask for the person's location once on entry, so teacher cards can show
  // a live distance right away. Skipped if we already have a location, or
  // they've dismissed this prompt on a previous visit.
  const showingMaintenancePage = state.maintenanceMode && state.profile?.role!=='admin';
  if(!showingMaintenancePage && !state.myLocation && !locationPreviouslyDeclined){
    openModal(locationPromptModal());
  }
}

// Screens that are themselves part of the login/signup funnel — not worth
// remembering as "where the user was", since landing back on them after
// authenticating would just undo the flow instead of resuming a task.
const AUTH_FUNNEL_VIEWS = new Set(['studentAuth','teacherAuth','teacherHome','teacherOnboarding','adminAuth']);
// Snapshots the current screen right before sending the user off to log in
// or sign up, so they can be dropped back exactly where they were —
// including reopening things like the enquiry form — once they're done.
// Called from every point on the site that redirects to studentAuth/
// teacherAuth because an action needed an account first.
function captureAuthRedirect(extra){
  if(AUTH_FUNNEL_VIEWS.has(state.view)) return; // nothing worth remembering
  state.postLoginRedirect = { view: state.view, selectedTeacherId: state.selectedTeacherId, selectedTeacherFrom: state.selectedTeacherFrom, ...extra };
}
// After logging in or signing up anywhere on the site, this sends the user
// back to whatever screen prompted the login (restoring the teacher profile,
// reopening the enquiry modal, etc.) instead of always dropping them on a
// fixed default screen. Falls back to defaultView when there's nothing to
// restore (e.g. they arrived at the auth screen directly, not mid-task).
function goPostAuth(defaultView){
  const redirect = state.postLoginRedirect;
  state.postLoginRedirect = null;
  if(redirect){
    const { reopenEnquiryFor, reopenChatFor, ...navState } = redirect;
    nav(navState.view, navState);
    if(reopenEnquiryFor) openModal(enquiryModal(reopenEnquiryFor));
    if(reopenChatFor){
      const t = TEACHERS.find(x=>x.id===reopenChatFor);
      if(t) openChat(reopenChatFor, state.session.user.id, t.name);
    }
    return;
  }
  nav(defaultView);
}

/* =========================================================
   ADMIN — "SIGN IN AS" (impersonation)
========================================================= */
// While an admin is signed in as someone else, we keep the admin's own
// tokens in sessionStorage (never localStorage — this should not survive
// the tab closing) under this key, plus who/what they're currently
// looking at, so "Return to admin" can restore the admin session and the
// impersonation banner survives a page refresh.
const IMPERSONATION_KEY = 'npt-impersonation';

function getImpersonationState(){
  try{ return JSON.parse(sessionStorage.getItem(IMPERSONATION_KEY) || 'null'); }catch(e){ return null; }
}
function clearImpersonationState(){
  try{ sessionStorage.removeItem(IMPERSONATION_KEY); }catch(e){}
}

// Called from the admin panel's "🔑 Sign in as" button. Stashes the
// admin's own session, swaps the browser's live session for the target
// user's via a magic-link token from the admin-impersonate-user Edge
// Function (see that file for the actual security check — this frontend
// call proves nothing by itself), and lands on their dashboard.
async function impersonateUser(id, name){
  const { data:{ session: adminSession } } = await sb.auth.getSession();
  if(!adminSession) return { error: 'Not signed in.' };
  const { data, error } = await sb.functions.invoke('admin-impersonate-user', { body: { id } });
  if(error) return { error: error.message };
  if(data?.error) return { error: data.error };
  authFlowInProgress = true;
  const { error: verifyErr } = await sb.auth.verifyOtp({ email: data.email, token_hash: data.token_hash, type: 'magiclink' });
  if(verifyErr){ authFlowInProgress = false; return { error: verifyErr.message }; }
  await refreshProfile();
  studentDataStatus = 'idle'; teacherDataStatus = 'idle'; adminDataStatus = 'idle';
  resetChatWidget();
  lastAuthUserId = id;
  authFlowInProgress = false;
  try{
    sessionStorage.setItem(IMPERSONATION_KEY, JSON.stringify({
      adminAccessToken: adminSession.access_token,
      adminRefreshToken: adminSession.refresh_token,
      targetName: data.name || name || 'this account',
      targetRole: data.role,
    }));
  }catch(e){}
  // A lightweight audit trail — visible to any admin in the Diagnostics
  // tab, same table used for client-reported errors (see schema.sql).
  sb.from('site_logs').insert({ level:'info', context:'Admin', message:`Admin signed in as ${data.name||name||'a user'} (${data.role})` }).then(()=>{});
  return { ok: true, role: data.role };
}

// Called from the "🔙 Return to admin" banner. Restores the admin's own
// session from what was stashed before impersonating.
async function returnToAdmin(){
  const imp = getImpersonationState();
  if(!imp) return;
  clearImpersonationState();
  const { error } = await sb.auth.setSession({ access_token: imp.adminAccessToken, refresh_token: imp.adminRefreshToken });
  if(error){ toast('❌ Your admin session expired — log back in.', 'err'); nav('adminAuth'); return; }
  nav('adminDashboard');
}

// Step 1 of forgot-password: first check (via the email_exists() SQL
// function — see schema.sql) whether this address is even registered. If
// not, tell the person plainly and offer a sign-up link instead of
// silently sending nothing. Only if it IS registered do we ask Supabase
// to email a 6-digit code. This only works once the email template has
// been switched to show {{ .Token }} — see README "Part 9".
//
// NOTE: this deliberately gives up Supabase's default "don't reveal
// whether an email exists" protection (see the comment on email_exists()
// in schema.sql) in exchange for a clearer error message here.
async function requestPasswordReset(email){
  if(!email) return toast('Please enter your email', 'warn');
  const { data: exists, error: checkError } = await sb.rpc('email_exists', { check_email: email });
  if(checkError) return toast('❌ ' + checkError.message, 'err');
  fpEmail = email;
  if(!exists){ openModal(forgotPasswordModal('not-found')); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email);
  if(error) return toast('❌ ' + error.message, 'err');
  toast('📧 A code is on its way', 'ok');
  openModal(forgotPasswordModal('verify'));
}

// Step 2: verifying the code signs the user in with a short-lived
// "recovery" session, which is exactly enough permission to call
// updateUser() and set a new password — then they're left logged in.
async function confirmPasswordReset(code, newPassword, confirmPassword){
  if(!code || !newPassword || !confirmPassword) return toast('Please fill in all fields', 'warn');
  if(newPassword.length < 6) return toast('Password must be at least 6 characters', 'warn');
  if(newPassword !== confirmPassword) return toast("Passwords don't match", 'warn');
  authFlowInProgress = true;
  try{
    const { data, error } = await sb.auth.verifyOtp({ email: fpEmail, token: code, type: 'recovery' });
    if(error) return toast('❌ ' + error.message, 'err');
    const { error: updateError } = await sb.auth.updateUser({ password: newPassword });
    if(updateError) return toast('❌ ' + updateError.message, 'err');
    state.session = data.session;
    lastAuthUserId = data.session?.user?.id || null;
    await refreshProfile();
    closeModal();
    toast('✅ Password updated — you\'re logged in', 'ok');
    if(state.profile?.role==='teacher'){ teacherDataStatus = 'idle'; goPostAuth('teacherDashboard'); }
    else if(state.profile?.role==='admin'){ nav('adminDashboard'); }
    else{ studentDataStatus = 'idle'; goPostAuth('studentDashboard'); }
  }finally{
    authFlowInProgress = false;
  }
}

async function ensureStudentData(force){

      sb.from('enrollments').select('*, teacher_profiles(profiles(full_name))').eq('student_id', uid).order('created_at',{ascending:false}),
      sb.from('payments').select('*').eq('student_id', uid).order('paid_at',{ascending:false}),
      sb.from('reviews').select('*').eq('student_id', uid),
      sb.from('trial_requests').select('*, batches(name,subject,grade,stream,days,time), teacher_profiles(profiles(full_name))').eq('student_id', uid).order('created_at',{ascending:false}),
      sb.from('notifications').select('*, teacher_profiles(profiles(full_name))').eq('student_id', uid).order('created_at',{ascending:false}),
      // Remarks a teacher leaves alongside marks are visible to the
      // student they're about (RLS already scopes this to just their own
      // rows — see "marks visible to teacher or the student" in schema.sql).
      sb.from('assessment_marks').select('*, assessments(title,subject,max_marks,created_at,batches(name))').eq('student_id', uid).order('created_at',{ascending:false}),
    ]);
    if(e1) throw e1; if(e2) throw e2; if(e3) throw e3; if(e4) throw e4; if(e5) throw e5; if(e6) throw e6;
    const enrollmentRows = enrollments.map(e=>({

    // student's dashboard (fee totals, "My enrollments", batch access).

    myEnrollments = enrollmentRows.filter(e=>e.approvalStatus==='approved');
    myPendingEnrollments = enrollmentRows.filter(e=>e.approvalStatus==='pending');

    }));
    myMarks = marks.map(m=>({
      title: m.assessments?.title||'Assessment', subject: m.assessments?.subject||'', maxMarks: m.assessments?.max_marks||100,
      batchName: m.assessments?.batches?.name||'', marks: m.marks, remarks: m.remarks||'', createdAt: m.assessments?.created_at||m.created_at,

    if(e1) throw e1;
    const batchIds = (mine||[]).filter(m=>m.batches).map(m=>m.batch_id);
    const classmatesByBatch = {};
    if(batchIds.length){
      const { data: roster, error: e2 } = await sb.from('batch_students').select('batch_id, student_id, profiles(full_name)').in('batch_id', batchIds);
      if(e2) throw e2;
      (roster||[]).forEach(r=>{
        if(r.student_id === uid) return;
        (classmatesByBatch[r.batch_id] = classmatesByBatch[r.batch_id] || []).push({ id:r.student_id, name: r.profiles?.full_name || 'Classmate' });
      });
    }
    myStudentBatches = (mine||[]).filter(m=>m.batches).map(m=>({
      id:m.batches.id, name:m.batches.name, subject:m.batches.subject, grade:m.batches.grade||'', stream:m.batches.stream||'',
      days:m.batches.days||[], time:m.batches.time||'', currentTopic:m.batches.current_topic||'', nextClassDate:m.batches.next_class_date||'',
      teacherName: m.batches.teacher_profiles?.profiles?.full_name || 'Teacher',
      classmates: classmatesByBatch[m.batches.id] || [],
    }));
    studentBatchesStatus = 'ready';
  }catch(err){
    console.error('Failed to load student batches', err);
    studentBatchesStatus = 'error';
  }
  render();
}

async function ensureTeacherData(force){
  if(!state.session || state.profile?.role!=='teacher') return;
  if(teacherDataStatus==='ready' && !force) return;
  teacherDataStatus = 'loading';
  try{
    const uid = state.session.user.id;
    const [{data, error}, {data:enquiries, error:eqErr}, {data:batches, error:bErr}, {data:trials, error:trErr}, {data:teacherNotifs, error:tnErr}] = await Promise.all([
      sb.from('enrollments').select('*, profiles(full_name, grade)').eq('teacher_id', uid).order('created_at',{ascending:false}),
      sb.from('enquiries').select('*, profiles(full_name)').eq('teacher_id', uid).order('created_at',{ascending:false}),
      sb.from('batches').select('*, batch_students(student_id, profiles(full_name))').eq('teacher_id', uid).order('created_at',{ascending:false}),
      sb.from('trial_requests').select('*, profiles(full_name), batches(name,subject,grade,stream,days,time)').eq('teacher_id', uid).order('created_at',{ascending:false}),
      sb.from('teacher_notifications').select('*, profiles(full_name)').eq('teacher_id', uid).order('created_at',{ascending:false}),
    ]);
    if(error) throw error;
    if(eqErr) throw eqErr;
    if(bErr) throw bErr;
    if(trErr) throw trErr;
    if(tnErr) throw tnErr;
    const enrollmentRows = data.map(e=>({
      enrollmentId:e.id, studentId:e.student_id, name: e.profiles?.full_name || 'Student',
      // a student's grade is set on their own profile (dashboard → My
      // profile), not per-enrollment — fall back to the enrollment's own
      // grade column only if the profile one was never set.
      grade: e.profiles?.grade || e.grade || '—', subject:e.subject, feeStatus:e.status, fee:e.fee, schedule:e.schedule,
      approvalStatus: e.approval_status || 'approved', enrolledAt: e.created_at,
    }));
    // Everything downstream (fee tracking, batch assignment, per-student
    // profile) only deals with accepted enrollments — a pending one lives
    // solely in the "Enrollment requests" list below until accepted.
    myStudents = enrollmentRows.filter(e=>e.approvalStatus==='approved');
    myPendingEnrollmentRequests = enrollmentRows.filter(e=>e.approvalStatus==='pending');
    myEnquiries = enquiries.map(q=>({
      id:q.id, studentId:q.student_id, name: q.profiles?.full_name || 'A parent',
      message:q.message, createdAt:q.created_at,
    }));
    myBatches = batches.map(b=>({
      id:b.id, name:b.name, grade:b.grade||'', stream:b.stream||'', subject:b.subject, days:b.days||[], time:b.time||'',
      description:b.description||'', capacity:b.capacity, status:b.status,
      currentTopic: b.current_topic||'', nextClassDate: b.next_class_date||'',
      students: (b.batch_students||[]).map(bs=>({id:bs.student_id, name:bs.profiles?.full_name||'Student'})),
    }));
    myTrialRequests = trials.map(r=>({
      id:r.id, studentId:r.student_id, studentName: r.profiles?.full_name || 'A student', batchId:r.batch_id,
      batchName: r.batches?.name || 'Class', subject: r.batches?.subject || '', grade: r.batches?.grade || '', stream: r.batches?.stream || '',
      days: (r.batches?.days||[]).join(', '), time: r.batches?.time || '', note:r.note, status:r.status, createdAt:r.created_at,
    }));
    myTeacherNotifications = teacherNotifs.map(n=>({
      id:n.id, studentId:n.student_id, studentName: n.profiles?.full_name || 'A student', type:n.type,
      title:n.title, message:n.message||'', readAt:n.read_at, createdAt:n.created_at,
    }));
    teacherDataStatus = 'ready';
  }catch(err){
    console.error('Failed to load teacher dashboard data', err);
    teacherDataStatus = 'error';
    reportError('Teacher dashboard', err);
  }
  render();
}

// Fetches everything for a single student's full profile view (opened by
// a teacher clicking a student's name in Students or a batch's detail
// view): their grade/stream, every attendance record across the
// teacher's own batches with them, and every assessment mark they've
// received from this teacher. RLS already scopes all three queries to
// just this teacher's own data, so no extra filtering is needed beyond
// student_id.
async function ensureStudentProfileDetail(studentId, force){
  if(studentProfileDetail.id===studentId && studentProfileDetail.status==='ready' && !force) return;
  studentProfileDetail = { id: studentId, status: 'loading', profile: null, attendance: [], assessments: [] };
  refreshTeacherPane();
  try{
    const [{data:profile, error:pErr}, {data:attendance, error:aErr}, {data:marks, error:mErr}] = await Promise.all([
      sb.from('profiles').select('full_name, grade, stream').eq('id', studentId).single(),
      sb.from('attendance').select('*, batches(name,subject)').eq('student_id', studentId).order('date',{ascending:false}),
      sb.from('assessment_marks').select('*, assessments(title,subject,max_marks,created_at,batches(name))').eq('student_id', studentId).order('created_at',{ascending:false}),
    ]);
    if(pErr) throw pErr;
    if(aErr) throw aErr;
    if(mErr) throw mErr;
    if(studentProfileDetail.id !== studentId) return; // switched to a different student while this was loading
    studentProfileDetail = {
      id: studentId, status: 'ready', profile,
      attendance: (attendance||[]).map(a=>({date:a.date, status:a.status, batchName:a.batches?.name||'Batch', subject:a.batches?.subject||''})),
      assessments: (marks||[]).map(m=>({
        title: m.assessments?.title||'Assessment', subject: m.assessments?.subject||'', maxMarks: m.assessments?.max_marks||100,
        batchName: m.assessments?.batches?.name||'', marks: m.marks, remarks: m.remarks||'', createdAt: m.assessments?.created_at||m.created_at,
      })),
    };
  }catch(err){
    console.error('Failed to load student profile', err);
    studentProfileDetail.status = 'error';
  }
  refreshTeacherPane();
}

// Loads every profile for the admin panel. Deliberately two plain queries
// (rather than an embedded join) merged client-side, so it works the same
// regardless of PostgREST's embed direction for the profiles<->teacher_profiles
// relationship. RLS still applies: 'profiles' and 'teacher_profiles' are
// both publicly readable, so this works whether or not the viewer is an admin —
// it's the delete action below that's actually gated (see schema.sql).
async function ensureAdminData(force){
  if(!state.session || state.profile?.role!=='admin') return;
  if(adminDataStatus==='ready' && !force) return;
  adminDataStatus = 'loading';
  try{
    // enrollments/payments/enquiries are normally only visible to the two
    // people involved — the "admins can view all …" policies in
    // schema.sql are what let these three queries return every row here.
    const [
      {data:profiles, error},
      {data:teacherRows, error:tErr},
      {data:enrollmentRows, error:enErr},
      {data:paymentRows, error:payErr},
      {data:enquiryRows, error:enqErr},
      {data:reviewRows, error:revErr},
    ] = await Promise.all([
      sb.from('profiles').select('*').order('created_at',{ascending:false}),
      sb.from('teacher_profiles').select('profile_id, category, subjects, fee_start, fee_unit, rating, reviews'),
      sb.from('enrollments').select('id, student_id, teacher_id, subject, fee, status, created_at'),
      sb.from('payments').select('id, student_id, amount, method, paid_at'),
      sb.from('enquiries').select('id, teacher_id, student_id, message, created_at'),
      sb.from('reviews').select('id, teacher_id, student_id, rating, comment, created_at').order('created_at',{ascending:false}),
    ]);
    if(error) throw error;
    if(tErr) throw tErr;
    if(enErr) throw enErr;
    if(payErr) throw payErr;
    if(enqErr) throw enqErr;
    if(revErr) throw revErr;
    const teacherById = {};
    teacherRows.forEach(t=>{ teacherById[t.profile_id] = t; });
    ADMIN_STUDENTS = profiles.filter(p=>p.role==='student');
    ADMIN_TEACHERS = profiles.filter(p=>p.role==='teacher').map(p=>({ ...p, listing: teacherById[p.id] || null }));
    ADMIN_ENROLLMENTS = enrollmentRows || [];
    ADMIN_PAYMENTS = paymentRows || [];
    ADMIN_ENQUIRIES = enquiryRows || [];
    const nameById = {};
    profiles.forEach(p=>{ nameById[p.id] = p.full_name; });
    ADMIN_ENROLLMENTS = ADMIN_ENROLLMENTS.map(e=>({ ...e, studentName: nameById[e.student_id] || 'Unknown student', teacherName: nameById[e.teacher_id] || 'Unknown teacher' }));
    ADMIN_ENQUIRIES = ADMIN_ENQUIRIES.map(q=>({ ...q, studentName: nameById[q.student_id] || 'Unknown student', teacherName: nameById[q.teacher_id] || 'Unknown teacher' }));
    ADMIN_REVIEWS = (reviewRows||[]).map(r=>({ ...r, teacherName: nameById[r.teacher_id] || 'Unknown teacher', studentName: nameById[r.student_id] || 'Unknown student' }));
    adminDataStatus = 'ready';
  }catch(err){
    console.error('Failed to load admin data', err);
    adminDataStatus = 'error';
    reportError('Admin panel', err);
  }
  render();
}

/* =========================================================
   SITE MAINTENANCE MODE — a single publicly-readable row in
   site_settings (key='maintenance', value:{enabled}) that every
   visitor's page checks before rendering anything else. Toggled from
   the admin panel (setMaintenanceMode below); the update itself is
   gated server-side by an admin-only RLS policy (see schema.sql), so
   this is a real lock, not just a client-side flag. A realtime
   subscription means anyone already browsing sees the maintenance page
   appear/disappear live, with no refresh needed.
========================================================= */
let maintenanceChannel = null;

async function ensureMaintenanceStatus(){
  try{
    // maybeSingle (not single) so a project that hasn't run the
    // migration for this yet just quietly defaults to "off" instead of
    // throwing on a missing row/table.
    const { data, error } = await sb.from('site_settings').select('value').eq('key','maintenance').maybeSingle();
    if(!error && data) state.maintenanceMode = !!data.value?.enabled;
  }catch(err){
    console.error('Failed to load maintenance status', err);
  }
}

function subscribeMaintenanceRealtime(){
  if(maintenanceChannel) return;
  maintenanceChannel = sb.channel('site-settings-watch')
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'site_settings', filter:'key=eq.maintenance' }, (payload)=>{
      state.maintenanceMode = !!payload.new?.value?.enabled;
      render();
    })
    .subscribe();
}

// Flips maintenance mode on/off from the admin panel. schema.sql's RLS
// policy is what actually restricts this to admins — this function just
// calls the update and reflects the result locally, same as every other
// open tab/browser will a moment later via the realtime subscription.
async function setMaintenanceMode(enabled){
  const { error } = await sb.from('site_settings')
    .update({ value: { enabled }, updated_at: new Date().toISOString() })
    .eq('key', 'maintenance');
  if(error) return toast('❌ ' + error.message, 'err');
  state.maintenanceMode = enabled;
  toast(enabled ? '🛠️ Maintenance mode is ON — visitors now see a maintenance page.' : '✅ Maintenance mode is off — the site is live again.', enabled ? 'warn' : 'ok');
  render();
}

========================================================= */
function filteredTeachers(){
  const f = state.filters;
  const list = TEACHERS.filter(t=>{
    if(f.category!=='all' && t.category!==f.category) return false;
    if(f.query && !(t.name.toLowerCase().includes(f.query.toLowerCase()) || t.subjects.join(' ').toLowerCase().includes(f.query.toLowerCase()))) return false;
    return true;
  });
  if(f.sortDistance && state.myLocation){
    // Nearest to farthest. Teachers without saved coordinates have no
    // known distance, so they're pushed to the end rather than dropped.
    list.sort((a,b)=>{
      const da = distanceKmToTeacher(a), db = distanceKmToTeacher(b);
      if(da==null && db==null) return 0;
      if(da==null) return 1;
      if(db==null) return -1;
      return da - db;
    });
  }
  return list;
}

function teacherStudents(){
  const pendingCount = myStudents.filter(s=>s.feeStatus!=='paid').length;
  const feeFilter = state.studentsFilter;          // null | 'pending'
  const batchFilter = state.studentsBatchFilter;    // null | batch id (string)

  // Which batch(es) each student belongs to, for this teacher — used for
  // the Batch column and the batch filter dropdown. A student can be in
  // more than one batch (e.g. different subjects), so this is a list.
  const batchesByStudent = {};
  myBatches.forEach(b=>{
    b.students.forEach(st=>{
      (batchesByStudent[st.id] = batchesByStudent[st.id] || []).push(b);
    });
  });

  let filtered = myStudents;
  if(feeFilter==='pending') filtered = filtered.filter(s=>s.feeStatus!=='paid');
  if(batchFilter) filtered = filtered.filter(s=>(batchesByStudent[s.studentId]||[]).some(b=>String(b.id)===String(batchFilter)));

  const hasActiveFilter = !!(feeFilter || batchFilter);

  return `
  ${myPendingEnrollmentRequests.length ? `<div class="glass" style="padding:22px; margin-bottom:16px; border:1px solid var(--amber, #F5A623);">
    <h3 style="font-size:15.5px; margin-bottom:12px;">🕒 Enrollment requests (${myPendingEnrollmentRequests.length})</h3>
    <div style="display:flex; flex-direction:column; gap:8px;">
      ${myPendingEnrollmentRequests.map(r=>`
      <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; padding:10px 12px; border-radius:12px; background:var(--divider-soft);">
        <div>
          <div style="font-weight:600; font-size:13.5px;">${escapeHtml(r.name)}</div>
          <div class="muted" style="font-size:12px;">${escapeHtml(r.subject)}${r.schedule?' · '+escapeHtml(r.schedule):''} · ₹${r.fee}</div>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-primary btn-sm" data-action="open-accept-enrollment" data-id="${r.enrollmentId}">✅ Accept</button>
          <button class="btn btn-ghost btn-sm" data-action="decline-enrollment" data-id="${r.enrollmentId}">✖️ Decline</button>
        </div>
      </div>`).join('')}
    </div>
  </div>` : ''}
  <div class="glass" style="padding:22px;">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px;">
      <h3 style="font-size:15.5px;">My students ${feeFilter==='pending' ? `<span class="badge badge-amber" style="margin-left:6px;">Pending fees only</span>` : ''}</h3>
      <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
        <select class="input" data-action="students-fee-filter" style="width:auto; padding:8px 10px; font-size:12.5px;">
          <option value="all" ${!feeFilter?'selected':''}>All fee statuses</option>
          <option value="pending" ${feeFilter==='pending'?'selected':''}>Fee pending</option>
        </select>
        <select class="input" data-action="students-batch-filter" style="width:auto; padding:8px 10px; font-size:12.5px;">
          <option value="all" ${!batchFilter?'selected':''}>All batches</option>
          ${myBatches.map(b=>`<option value="${b.id}" ${String(batchFilter)===String(b.id)?'selected':''}>${escapeHtml(b.name)} (${escapeHtml(b.subject)})</option>`).join('')}
        </select>
        ${hasActiveFilter ? `<button class="btn btn-ghost btn-sm" data-action="clear-students-filter">Show all</button>` : ''}
        ${pendingCount ? `<button class="btn btn-primary btn-sm" data-action="notify-pending-fees">🔔 Notify pending fees (${pendingCount})</button>` : ''}
      </div>
    </div>
    ${filtered.length ? `<table class="data-table">
      <thead><tr><th>Name</th><th>Grade</th><th>Subject</th><th>Batch</th><th>Fee status</th><th>Fee</th><th>Enrolled</th><th></th></tr></thead>
      <tbody>
        ${filtered.map(s=>{
          const batchNames = (batchesByStudent[s.studentId]||[]).map(b=>b.name).join(', ');
          return `
        <tr style="cursor:pointer;" data-action="open-student-profile" data-id="${s.studentId}">
          <td style="font-weight:600;">${escapeHtml(s.name)}</td>
          <td class="muted">${s.grade}</td>
          <td class="muted">${s.subject}</td>
          <td class="muted">${batchNames ? escapeHtml(batchNames) : '—'}</td>
          <td><span class="badge ${s.feeStatus==='paid'?'badge-green':s.feeStatus==='due'?'badge-amber':'badge-red'}">${s.feeStatus.toUpperCase()}</span></td>
          <td class="muted">₹${s.fee}</td>
          <td class="muted">${s.enrolledAt ? new Date(s.enrolledAt).toLocaleDateString() : '—'}</td>
          <td style="white-space:nowrap;">
            <button class="btn btn-ghost btn-sm" data-action="open-chat" data-teacher="${state.session.user.id}" data-student="${s.studentId}" data-name="${escapeHtml(s.name)}">💬 Chat</button>
            ${s.feeStatus!=='paid' ? `<button class="btn btn-ghost btn-sm" data-action="notify-fee" data-id="${s.enrollmentId}">🔔 Notify fee</button>` : ''}
            <button class="btn btn-ghost btn-sm" data-action="remove-enrollment" data-id="${s.enrollmentId}" data-name="${escapeHtml(s.name)}" data-subject="${escapeHtml(s.subject)}">🗑️ Remove</button>
          </td>
        </tr>`;}).join('')}
      </tbody>
    </table>` : (hasActiveFilter ? `<p class="muted" style="font-size:13.5px;">No students match this filter.</p>` : `<p class="muted" style="font-size:13.5px;">No students enrolled yet. Share your profile link so parents can find you.</p>`)}
  </div>`;
}

}

function attendanceCounts(batchId, studentId){
  const arr = (batchAttendance[batchId]||[]).filter(a=>a.studentId===studentId);
  return {
    present: arr.filter(a=>a.status==='present').length,
    absent: arr.filter(a=>a.status==='absent').length,
    late: arr.filter(a=>a.status==='late').length,
    today: arr.find(a=>a.date===todayStr())?.status || null,
  };
}

function batchDetailView(batchId){
  const b = myBatches.find(x=>x.id===batchId);
  if(!b) return teacherBatches();
  if(batchAttendanceForId!==batchId || batchAttendanceStatus==='idle') { ensureBatchAttendance(batchId); }
  const loadingAttendance = batchAttendanceForId!==batchId || batchAttendanceStatus==='loading';
  const feeDue = b.students.filter(s=>{
    const enr = myStudents.find(ms=>ms.studentId===s.id && ms.subject===b.subject) || myStudents.find(ms=>ms.studentId===s.id);
    return enr && enr.feeStatus!=='paid';

  <div class="glass" style="padding:22px;">
    <button class="btn btn-ghost btn-sm" style="margin-bottom:14px;" data-action="back-to-batches">← Back to batches</button>

      <div>
        <div style="font-weight:700; font-size:18px;">${escapeHtml(b.name)} ${b.status==='inactive'?'<span class="badge" style="margin-left:6px;">Inactive</span>':''}</div>
        <div class="muted" style="font-size:13px; margin-top:4px;">${escapeHtml(b.subject)}${b.grade?' · '+escapeHtml(b.grade):''}${b.stream?' · '+escapeHtml(b.stream):''} · ${(b.days||[]).join(', ')||'Days TBC'} · ${escapeHtml(b.time)||'Time TBC'}</div>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="btn btn-primary btn-sm" data-action="open-notify-batch" data-id="${b.id}">📣 Notify students</button>
        <button class="btn btn-primary btn-sm" data-action="open-assessment-modal" data-id="${b.id}">📝 New assessment</button>
        <button class="btn btn-ghost btn-sm" data-action="open-batch-modal" data-id="${b.id}">✏️ Edit</button>
      </div>
    </div>
    ${b.description ? `<p class="muted" style="font-size:13px; margin-top:8px; line-height:1.5;">${escapeHtml(b.description)}</p>` : ''}
    ${(b.currentTopic || b.nextClassDate) ? `<div style="display:flex; gap:16px; margin-top:10px; flex-wrap:wrap; font-size:12.5px;" class="muted">
      ${b.currentTopic ? `<span>📖 Currently on: <strong style="color:var(--text);">${escapeHtml(b.currentTopic)}</strong></span>` : ''}
      ${b.nextClassDate ? `<span>📅 Next class: <strong style="color:var(--text);">${new Date(b.nextClassDate+'T00:00:00').toLocaleDateString()}</strong></span>` : ''}
    </div>` : ''}

    <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:18px 0;" class="grid-2">
      <div class="glass stat-card" style="padding:16px;"><div class="eyebrow">Students</div><div class="stat-num" style="font-size:22px;">${b.students.length}${b.capacity?'/'+b.capacity:''}</div></div>
      <div class="glass stat-card" style="padding:16px;"><div class="eyebrow">Fee due</div><div class="stat-num" style="font-size:22px; color:${feeDue>0?'var(--red)':'var(--green)'}">${feeDue}</div></div>
      <div class="glass stat-card" style="padding:16px;"><div class="eyebrow">Marked today</div><div class="stat-num" style="font-size:22px;">${(batchAttendance[batchId]||[]).filter(a=>a.date===todayStr()).length}/${b.students.length}</div></div>
    </div>

    <h4 style="font-size:14px; margin-bottom:10px;">Students</h4>
    ${!b.students.length ? `<p class="muted" style="font-size:13.5px;">No students in this batch yet — click "Manage students" from the batch list to add some.</p>` : `
    <div style="display:flex; flex-direction:column; gap:8px;">
      ${b.students.map(s=>{
        // Fee doesn't differ by batch/subject for a given student with this
        // teacher, so fall back to any enrollment record for them if there
        // isn't one for this exact subject.
        const enr = myStudents.find(ms=>ms.studentId===s.id && ms.subject===b.subject) || myStudents.find(ms=>ms.studentId===s.id);
        const c = attendanceCounts(batchId, s.id);
        return `<details style="border-radius:12px; background:var(--divider-soft); overflow:hidden;">
          <summary style="cursor:pointer; padding:12px 14px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; list-style:none;">

                ${['present','absent','late'].map(st=>`<button class="btn btn-sm ${c.today===st?'btn-primary':'btn-ghost'}" data-action="mark-attendance" data-batch="${batchId}" data-student="${s.id}" data-status="${st}">${st==='present'?'✅':st==='absent'?'❌':'⏰'} ${st[0].toUpperCase()+st.slice(1)}</button>`).join('')}

// Full profile view for one student, opened by a teacher clicking their
// name from Students or a batch's detail view. Shows their grade/stream,
// every enrollment with this teacher, every attendance record across the
// teacher's own batches with them, and every assessment mark they've
// received — plus a chat shortcut. Backed by ensureStudentProfileDetail().
function teacherStudentProfileView(studentId){
  if(studentProfileDetail.id!==studentId || studentProfileDetail.status==='idle'){ ensureStudentProfileDetail(studentId); }
  const loading = studentProfileDetail.id!==studentId || studentProfileDetail.status==='loading';
  const backBtn = `<button class="btn btn-ghost btn-sm" style="margin-bottom:14px;" data-action="back-to-students">← Back</button>`;
  if(loading){
    return `<div class="glass" style="padding:22px;">${backBtn}${teacherTabSkeleton()}</div>`;
  }
  if(studentProfileDetail.status==='error'){
    return `<div class="glass" style="padding:22px;">${backBtn}<p class="muted" style="font-size:13.5px;">Couldn't load this student's profile. Try again.</p></div>`;
  }
  const p = studentProfileDetail.profile;
  const enrollments = myStudents.filter(s=>s.studentId===studentId);
  const attendance = studentProfileDetail.attendance;
  const presentCount = attendance.filter(a=>a.status==='present').length;
  const assessments = studentProfileDetail.assessments;
  return `
  <div class="glass" style="padding:22px;">
    ${backBtn}
    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;">
      <div>
        <div style="font-weight:700; font-size:19px;">${escapeHtml(p?.full_name || 'Student')}</div>
        <div class="muted" style="font-size:13px; margin-top:4px;">${escapeHtml(p?.grade || 'Grade not set')}${p?.stream ? ' · '+escapeHtml(p.stream) : ''}</div>
      </div>
      <button class="btn btn-primary btn-sm" data-action="open-chat" data-teacher="${state.session.user.id}" data-student="${studentId}" data-name="${escapeHtml(p?.full_name||'Student')}">💬 Chat</button>
    </div>

    <h4 style="font-size:14px; margin:22px 0 10px;">Enrollments with you</h4>
    ${enrollments.length ? `<table class="data-table">
      <thead><tr><th>Subject</th><th>Fee status</th><th>Fee</th></tr></thead>
      <tbody>${enrollments.map(e=>`<tr><td style="font-weight:600;">${escapeHtml(e.subject)}</td><td><span class="badge ${e.feeStatus==='paid'?'badge-green':e.feeStatus==='due'?'badge-amber':'badge-red'}">${e.feeStatus.toUpperCase()}</span></td><td class="muted">₹${e.fee}</td></tr>`).join('')}</tbody>
    </table>` : `<p class="muted" style="font-size:13px;">No enrollments with you.</p>`}

    <h4 style="font-size:14px; margin:22px 0 10px;">Attendance ${attendance.length ? `<span class="muted" style="font-weight:400; font-size:12px;">(${presentCount}/${attendance.length} present)</span>` : ''}</h4>
    ${attendance.length ? `<div style="display:flex; flex-direction:column; gap:6px; max-height:240px; overflow-y:auto;">
      ${attendance.map(a=>`<div style="display:flex; justify-content:space-between; align-items:center; padding:8px 12px; border-radius:10px; background:var(--divider-soft); font-size:12.5px;">
        <span>${new Date(a.date+'T00:00:00').toLocaleDateString()} · ${escapeHtml(a.batchName)}${a.subject?' — '+escapeHtml(a.subject):''}</span>
        <span class="badge ${a.status==='present'?'badge-green':a.status==='absent'?'badge-red':'badge-amber'}">${a.status.toUpperCase()}</span>
      </div>`).join('')}
    </div>` : `<p class="muted" style="font-size:13px;">No attendance recorded yet.</p>`}

    <h4 style="font-size:14px; margin:22px 0 10px;">Assessment marks</h4>
    ${assessments.length ? `<table class="data-table">
      <thead><tr><th>Assessment</th><th>Subject</th><th>Score</th><th>Remarks</th></tr></thead>
      <tbody>${assessments.map(a=>`<tr>
        <td style="font-weight:600;">${escapeHtml(a.title)}<div class="muted" style="font-size:11px;">${escapeHtml(a.batchName)} · ${new Date(a.createdAt).toLocaleDateString()}</div></td>
        <td class="muted">${escapeHtml(a.subject)}</td>
        <td style="font-family:var(--mono); font-weight:700;">${a.marks}/${a.maxMarks}</td>
        <td class="muted">${escapeHtml(a.remarks)||'—'}</td>
      </tr>`).join('')}</tbody>
    </table>` : `<p class="muted" style="font-size:13px;">No assessment marks recorded yet.</p>`}
  </div>`;
}

// Switches the teacher dashboard's active tab without re-rendering the
// whole app — only #teacherSidebarPane (for the active-tab highlight) and
// #teacherTabPane (the actual content) are touched, so the page never
// visibly "reloads" when clicking between tabs. Shows a brief skeleton in
// between so the swap always feels like something is happening, even
// though the underlying data (loaded up front by ensureTeacherData) is
// already in memory — except for Profile, which fetches fresh data.
// preserveFilter=true skips clearing the Students tab's fee/batch filters —
// used only by the "Pending payments" stat card and the "Show all"/"View
// all students" shortcuts, which set the filter themselves right before
// calling this. Every other way of reaching a tab (sidebar clicks, landing
// here fresh) clears the filters, so a filter applied earlier never quietly
// stays active after you've navigated elsewhere and come back.
async function switchTeacherTab(tab, preserveFilter){
  const filterWasActive = !preserveFilter && (state.studentsFilter || state.studentsBatchFilter);
  if(!preserveFilter){ state.studentsFilter = null; state.studentsBatchFilter = null; }
  if(state.teacherTab === tab && !state.selectedStudentProfileId){
    if(filterWasActive) refreshTeacherPane();
    return;
  }
  state.teacherTab = tab;
  state.selectedBatchId = null;
  state.selectedStudentProfileId = null;
  const sidebarPane = document.getElementById('teacherSidebarPane');
  const pane = document.getElementById('teacherTabPane');
  if(!pane){ render(); return; }
  if(sidebarPane) sidebarPane.innerHTML = teacherSidebar();
  pane.classList.remove('pane-fade');
  pane.innerHTML = teacherTabSkeleton();
  try{
    if(tab==='profile'){
      const { data, error } = await sb.from('teacher_profiles').select('*, schedule_slots(day,time,subj)').eq('profile_id', state.session.user.id).single();
      if(error) throw error;
      state.selectedTeacherProfile = data;
    }else{
      // A short, deliberate pause so the skeleton is perceptible even
      // though this tab's data is already cached in memory.
      await new Promise(res=>setTimeout(res, 200));
    }
  }catch(err){
    toast('❌ ' + err.message, 'err');
  }
  if(state.teacherTab !== tab) return; // the user already switched to a different tab while this was loading
  const freshPane = document.getElementById('teacherTabPane');
  if(!freshPane) return;
  freshPane.innerHTML = renderTeacherPane();
  freshPane.classList.add('pane-fade');
}

let modalHTML = '';

function renderModal(){
  let root = document.getElementById('modalRoot');
  if(!root){ root = document.createElement('div'); root.id='modalRoot'; document.body.appendChild(root); }
  root.innerHTML = modalHTML ? `<div class="modal-backdrop" data-action="close-modal">${modalHTML}</div>` : '';

// The chat widget lives in its own fixed root (not modalRoot) so it floats
// in the corner without a full-screen backdrop, and so it doesn't get
// wiped out by an unrelated openModal()/closeModal() elsewhere on the
// site (e.g. opening the review modal while the widget is open).
function renderChatDock(){
  let root = document.getElementById('chatDockRoot');
  if(!root){ root = document.createElement('div'); root.id='chatDockRoot'; document.body.appendChild(root); }
  const canChat = state.session && ['teacher','student'].includes(state.profile?.role);
  if(!canChat){ root.innerHTML = ''; return; }
  if(conversationsStatus==='idle') ensureConversations(); // first render after login — kick off the initial load
  startPresence(); // no-op if already running this session
  startInboxTypingChannel(); // no-op if already running this session

  // Opening a thread triggers several back-to-back renders in quick
  // succession (the initial open, messages finishing their fetch, the
  // conversation list refresh finishing) — all still showing the same
  // open dock. The bubble/dock elements carry a CSS "pop in" entrance
  // animation, which used to replay every single time because
  // root.innerHTML got wiped and rebuilt from scratch on every call —
  // that's what made opening a thread look like it was popping open two
  // or three times in a row. Now the outer element is only replaced (and
  // the animation only plays) when actually switching between collapsed
  // and open; a same-shape render just refreshes its contents in place.
  const shape = chatWidgetOpen ? 'dock' : 'bubble';
  let el = root.firstElementChild;
  if(!el || el.dataset.shape !== shape){
    root.innerHTML = '';
    el = document.createElement(shape==='dock' ? 'div' : 'button');
    el.dataset.shape = shape;
    if(shape==='dock'){
      el.className = 'glass chat-dock';
    }else{
      el.className = 'chat-bubble';
      el.type = 'button';
      el.setAttribute('aria-label', 'Open messages');
      el.setAttribute('data-action', 'toggle-chat');
    }
    root.appendChild(el);
  }
  el.innerHTML = shape==='dock' ? (chatWidgetView==='thread' ? chatThreadHTML() : chatInboxHTML()) : chatBubbleInnerHTML();
}
