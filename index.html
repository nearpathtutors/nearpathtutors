/* =========================================================
   REALTIME CHAT WIDGET
   A persistent corner launcher, mounted into #chatDockRoot (outside #app,
   so it survives page navigation) whenever someone is logged in as a
   teacher or student. Collapsed, it's a round bubble with an unread
   badge; expanded, it shows either the inbox (every conversation —
   including ones with no messages yet, e.g. right after sending an
   enquiry) or a single open thread.

   One Realtime subscription (chatRealtimeChannel) covers every message
   for the whole session: a message for the open thread is appended live;
   a message for any other conversation just updates that conversation's
   inbox preview and unread badge.
========================================================= */

// Builds the full conversation list for the logged-in teacher/student:
// every enrollment, every enquiry (sent, if a student — received, if a
// teacher), and every existing message thread, merged into one list keyed
// by the other participant. Threads with no messages yet still show up
// (as "Say hello 👋") because a sent enquiry alone should surface the
// teacher in the student's inbox, per how this is meant to work.
async function ensureConversations(force){
  if(!state.session || !['teacher','student'].includes(state.profile?.role)) return;
  if(conversationsStatus==='ready' && !force) return;
  conversationsStatus = 'loading';
  renderChatDock();
  try{
    const uid = state.session.user.id;
    const role = state.profile.role;
    const partners = new Map();

    if(role==='teacher'){
      await ensureTeacherData();
      myStudents.forEach(s=> partners.set(s.studentId, { id:s.studentId, name:s.name, lastMessage:null, lastAt:null, lastMine:false, unread:false, lastSeenAt:null, typing:false }));
      myEnquiries.forEach(q=>{ if(!partners.has(q.studentId)) partners.set(q.studentId, { id:q.studentId, name:q.name, lastMessage:null, lastAt:null, lastMine:false, unread:false, lastSeenAt:null, typing:false }); });
    }else{
      await ensureStudentData();
      myEnrollments.forEach(e=> partners.set(e.teacherId, { id:e.teacherId, name:e.teacherName, lastMessage:null, lastAt:null, lastMine:false, unread:false, lastSeenAt:null, typing:false }));
      const { data: sent, error } = await sb.from('enquiries').select('teacher_id, teacher_profiles(profiles(full_name))').eq('student_id', uid);
      if(error) throw error;
      sent.forEach(q=>{
        if(!partners.has(q.teacher_id)) partners.set(q.teacher_id, { id:q.teacher_id, name:q.teacher_profiles?.profiles?.full_name || 'Teacher', lastMessage:null, lastAt:null, lastMine:false, unread:false, lastSeenAt:null, typing:false });
      });
    }

    const col = role==='teacher' ? 'teacher_id' : 'student_id';
    const { data: msgs, error: msgErr } = await sb.from('messages').select('teacher_id, student_id, sender_id, body, created_at, read_at').eq(col, uid).order('created_at', {ascending:true});
    if(msgErr) throw msgErr;
    // The thread I currently have open (if any) is always treated as read —
    // its messages get marked read the moment it's opened (see loadChatMessages),
    // but that write can lag a beat behind this query.
    const openOtherId = (chatWidgetOpen && chatWidgetView==='thread') ? (role==='teacher' ? chatStudentId : chatTeacherId) : null;
    msgs.forEach(m=>{
      const otherId = role==='teacher' ? m.student_id : m.teacher_id;
      let p = partners.get(otherId);
      if(!p){
        p = { id: otherId, name: null, lastMessage:null, lastAt:null, lastMine:false, unread:false, lastSeenAt:null, typing:false };
        partners.set(otherId, p);
      }
      p.lastMessage = m.body;
      p.lastAt = m.created_at;
      p.lastMine = m.sender_id === uid;
      // Recomputed on every message in order, so by the end this reflects
      // only the most recent message's read status, per partner.
      p.unread = otherId !== openOtherId && m.sender_id !== uid && !m.read_at;
    });

    // Resolve display names for any partner discovered only via messages
    // (no enquiry/enrollment on record) — e.g. a student who tapped
    // "Chat now" straight from a teacher's profile without ever sending
    // an enquiry, or a teacher whose very first exchange with a student
    // arrived that way.
    const unresolved = [...partners.values()].filter(p=>!p.name).map(p=>p.id);
    if(unresolved.length){
      const { data: people } = await sb.from('profiles').select('id, full_name').in('id', unresolved);
      (people||[]).forEach(person=>{
        const p = partners.get(person.id);
        if(p) p.name = person.full_name || 'Someone';
      });
    }

    // Last-seen, for everyone in the list at once.
    if(partners.size){
      const { data: seen } = await sb.from('profiles').select('id, last_seen_at').in('id', [...partners.keys()]);
      (seen||[]).forEach(person=>{
        const p = partners.get(person.id);
        if(p) p.lastSeenAt = person.last_seen_at;
      });
    }


    // Merge into the existing list rather than replacing it outright, so a
    // conversation opened just now via openChat() (before its first message
    // has actually been sent, so it isn't in any of the tables above yet)
    // doesn't get wiped out by this refresh.
    const merged = new Map(myConversations.map(c=>[c.id, c]));
    partners.forEach((fresh, id)=>{
      const existing = merged.get(id);
      merged.set(id, existing ? { ...existing, ...fresh } : fresh);
    });
    myConversations = [...merged.values()].sort((a,b)=> new Date(b.lastAt||0) - new Date(a.lastAt||0));
    conversationsStatus = 'ready';
  }catch(err){
    console.error('Failed to load conversations', err);
    conversationsStatus = 'error';
  }
  renderChatDock();
  subscribeSessionRealtime();
}

// One subscription per login, covering every message where I'm a
// participant. Filtered server-side on my own id in the relevant column
// (teacher_id if I'm a teacher, student_id if I'm a student) — Realtime
// filters only support one column, and this always fully identifies "my"
// messages since a given account is only ever one side of the table.
function subscribeSessionRealtime(){
  if(chatRealtimeChannel || !state.session) return; // already subscribed this session
  const uid = state.session.user.id;
  const role = state.profile.role;
  const col = role==='teacher' ? 'teacher_id' : 'student_id';
  chatRealtimeChannel = sb.channel(`session-messages-${uid}`)
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'messages', filter:`${col}=eq.${uid}` }, (payload)=>{
      const m = payload.new;
      const otherId = role==='teacher' ? m.student_id : m.teacher_id;
      const openOtherId = role==='teacher' ? chatStudentId : chatTeacherId;
      const isOpenThread = chatWidgetOpen && chatWidgetView==='thread' && otherId===openOtherId;

      if(isOpenThread && !chatMessages.some(x=>x.id===m.id)){
        chatMessages.push(m);
        appendChatMessage(m);
        if(m.sender_id!==uid){
          clearTimeout(chatTypingHideTimer);
          chatOtherTyping = false;
          renderChatTypingIndicator();
          markThreadRead(otherId); // I'm looking at this thread right now, so this counts as read immediately
        }
      }

      let p = myConversations.find(c=>c.id===otherId);
      let isNewRow = false;
      if(!p){
        p = { id:otherId, name: null, lastMessage:null, lastAt:null, lastMine:false, unread:false, typing:false };
        myConversations.unshift(p);
        isNewRow = true;
        sb.from('profiles').select('full_name').eq('id', otherId).single().then(({data})=>{
          p.name = data?.full_name || 'Someone';
          if(chatWidgetOpen && chatWidgetView==='inbox') patchInboxRowForNewMessage(otherId);
          else if(!chatWidgetOpen) renderChatDock();
        });
      }
      p.lastMessage = m.body;
      p.lastAt = m.created_at;
      p.lastMine = m.sender_id === uid;
      if(!isOpenThread && m.sender_id !== uid) p.unread = true;
      myConversations.sort((a,b)=> new Date(b.lastAt||0) - new Date(a.lastAt||0));

      if(m.sender_id !== uid){
        playPingSound();
        if(!isOpenThread){
          const preview = m.body.length>60 ? m.body.slice(0,60)+'…' : m.body;
          toast('💬 ' + escapeHtml(p.name || 'New message') + ': ' + escapeHtml(preview), 'ok', ()=> openThread(otherId, p.name));
        }
      }
      if(!isOpenThread){
        if(isNewRow || !chatWidgetOpen){
          // A brand-new conversation needs the whole list rebuilt so the row
          // exists at all; when the dock's collapsed this is just the tiny
          // bubble badge, so it's cheap either way.
          renderChatDock();
        }else if(chatWidgetView==='inbox'){
          // The inbox is open on an *existing* row — patch it in place
          // rather than rebuilding the whole list, so it doesn't look like
          // the chat is continuously reloading every time a message lands.
          patchInboxRowForNewMessage(otherId);
        }
        // else: a different thread is open right now — nothing on screen
        // needs to change; the inbox will pick this up next time it's opened.
      }
    })
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'messages', filter:`${col}=eq.${uid}` }, (payload)=>{
      const m = payload.new;
      if(m.sender_id !== uid || !m.read_at) return; // only care about my own messages just having been marked read
      const idx = chatMessages.findIndex(x=>x.id===m.id);
      if(idx!==-1) chatMessages[idx] = { ...chatMessages[idx], read_at: m.read_at };
      const otherId = role==='teacher' ? m.student_id : m.teacher_id;
      const openOtherId = role==='teacher' ? chatStudentId : chatTeacherId;
      if(chatWidgetOpen && chatWidgetView==='thread' && otherId===openOtherId) renderChatMessagesList();
    })
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'trial_requests', filter:`teacher_id=eq.${uid}` }, (payload)=>{
      // Only relevant for teachers — a student just requested a trial spot.
      if(role!=='teacher') return;
      const r = payload.new;
      sb.from('trial_requests').select('*, profiles(full_name), batches(name,subject,grade,stream,days,time)').eq('id', r.id).single().then(({data})=>{
        if(!data) return;
        const entry = {
          id:data.id, studentId:data.student_id, studentName: data.profiles?.full_name || 'A student', batchId:data.batch_id,
          batchName: data.batches?.name || 'Class', subject: data.batches?.subject || '', grade: data.batches?.grade || '', stream: data.batches?.stream || '',
          days: (data.batches?.days||[]).join(', '), time: data.batches?.time || '', note:data.note, status:data.status, createdAt:data.created_at,
        };
        if(!myTrialRequests.some(x=>x.id===entry.id)) myTrialRequests.unshift(entry);
        toast('🎯 ' + escapeHtml(entry.studentName) + ' requested a trial for ' + escapeHtml(entry.batchName), 'ok', ()=>{
          state.teacherTab = 'trials';
          nav('teacherDashboard');
        });
        if(state.view==='teacherDashboard' && state.teacherTab==='trials') render();
      });
    })
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'trial_requests', filter:`student_id=eq.${uid}` }, (payload)=>{
      // Only relevant for students — the teacher just approved/declined their
      // request. The toast itself comes from the matching `notifications`
      // row (below) so there's only one notice per event, not two.
      if(role!=='student') return;
      const r = payload.new;
      const entry = myTrialBookings.find(x=>x.id===r.id);
      if(entry){
        entry.status = r.status;
        entry.responseMessage = r.response_message || '';
        if(state.view==='studentDashboard') render();
      }
    })
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'notifications', filter:`student_id=eq.${uid}` }, (payload)=>{
      // Only relevant for students — a teacher just sent them a
      // notification (trial approved/declined, or a batch update).
      if(role!=='student') return;
      const n = payload.new;
      sb.from('teacher_profiles').select('profiles(full_name)').eq('profile_id', n.teacher_id).single().then(({data})=>{
        const entry = {
          id:n.id, teacherName: data?.profiles?.full_name || 'Your teacher', type:n.type,
          title:n.title, message:n.message||'', readAt:n.read_at, createdAt:n.created_at,
        };
        if(!myNotifications.some(x=>x.id===entry.id)) myNotifications.unshift(entry);
        playNotifSound();
        toast('🔔 ' + escapeHtml(entry.title), 'info', ()=>{
          state.studentTab = 'notifications';
          nav('studentDashboard');
        });
        // Always re-render (not just on the dashboard) so the navbar
        // bell's unread badge updates the instant this arrives, no
        // matter what page the student is currently looking at.
        render();
      });
    })
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'teacher_notifications', filter:`teacher_id=eq.${uid}` }, (payload)=>{
      // Only relevant for teachers — a student just enrolled, sent an
      // enquiry, marked a fee paid, or an admin sent a broadcast.
      if(role!=='teacher') return;
      const n = payload.new;
      const attachName = (name)=>{
        const entry = {
          id:n.id, studentName: name, type:n.type,
          title:n.title, message:n.message||'', readAt:n.read_at, createdAt:n.created_at,
        };
        if(!myTeacherNotifications.some(x=>x.id===entry.id)) myTeacherNotifications.unshift(entry);
        playNotifSound();
        toast('🔔 ' + escapeHtml(entry.title), 'info', ()=>{
          state.teacherTab = notifTargetTab(entry, 'teacher');
          nav('teacherDashboard');
        });
        render();
      };
      if(n.student_id){
        sb.from('profiles').select('full_name').eq('id', n.student_id).single().then(({data})=>{
          attachName(data?.full_name || 'A student');
        });
      }else{
        attachName('NearPath Tutors admin');
      }
    })
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'enrollments', filter:`teacher_id=eq.${uid}` }, (payload)=>{
      // Only relevant for teachers — a student just sent (or re-sent) an
      // enrollment request. The teacher_notifications toast above already
      // announces it; this keeps the live "Enrollment requests" list on
      // the Students tab in sync without a refresh.
      if(role!=='teacher') return;
      if(teacherDataStatus!=='ready') return;
      ensureTeacherData(true);
    })
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'enrollments', filter:`teacher_id=eq.${uid}` }, (payload)=>{
      // A student's own action (rare, but keeps the teacher's Students /
      // requests lists honest if an enrollment changes from elsewhere).
      if(role!=='teacher') return;
      if(teacherDataStatus!=='ready') return;
      ensureTeacherData(true);
    })
    .on('postgres_changes', { event:'DELETE', schema:'public', table:'enrollments', filter:`teacher_id=eq.${uid}` }, (payload)=>{
      if(role!=='teacher') return;
      if(teacherDataStatus!=='ready') return;
      ensureTeacherData(true);
    })
    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'enrollments', filter:`student_id=eq.${uid}` }, (payload)=>{
      // Only relevant for students — this fires when a teacher accepts
      // (or otherwise updates) their enrollment. Moves it from "pending"
      // to active on their dashboard instantly, no refresh needed.
      if(role!=='student') return;
      const e = payload.new;
      const wasPending = myPendingEnrollments.some(x=>x.id===e.id);
      if(e.approval_status==='approved' && wasPending){
        toast('🎉 Your enrollment for ' + e.subject + ' was accepted!', 'ok');
      }
      if(studentDataStatus==='ready') ensureStudentData(true);
    })
    .on('postgres_changes', { event:'DELETE', schema:'public', table:'enrollments', filter:`student_id=eq.${uid}` }, (payload)=>{
      // A pending request was declined (row deleted) — the matching
      // `notifications` row (above) already announces this; just keep the
      // student's own lists in sync.
      if(role!=='student') return;
      if(studentDataStatus==='ready') ensureStudentData(true);
    })
    .on('postgres_changes', { event:'INSERT', schema:'public', table:'batch_students', filter:`student_id=eq.${uid}` }, (payload)=>{
      // Only relevant for students — a teacher just added them to a
      // batch. The matching `notifications` row (above) shows the toast;
      // this refreshes "My batches" so it appears without a refresh.
      if(role!=='student') return;
      if(studentBatchesStatus==='ready') ensureStudentBatches(true);
    })
    .on('postgres_changes', { event:'DELETE', schema:'public', table:'batch_students', filter:`student_id=eq.${uid}` }, (payload)=>{
      if(role!=='student') return;
      if(studentBatchesStatus==='ready') ensureStudentBatches(true);
    })
    .subscribe();
}

function teardownSessionRealtime(){
  if(chatRealtimeChannel){ sb.removeChannel(chatRealtimeChannel); chatRealtimeChannel = null; }
}

// One Presence channel per login — every teacher/student currently on the
// site tracks themselves on it, so everyone else can tell who's online.
// Also stamps `last_seen_at` on load, on an interval, and whenever the tab
// is hidden, so "Last seen …" has something to show once they disconnect
// (Presence itself is purely live — it forgets you the instant you close
// the tab, it doesn't remember when you were last around).
function startPresence(){
  if(presenceChannel || !state.session) return;
  const uid = state.session.user.id;
  presenceChannel = sb.channel('online-users', { config: { presence: { key: uid } } });
  presenceChannel
    .on('presence', {event:'sync'}, ()=>{
      const newOnline = new Set(Object.keys(presenceChannel.presenceState()));
      // Anyone who just dropped offline: stamp an approximate last-seen
      // locally right away. The database's last_seen_at column only gets
      // written every ~45s (or on tab-hide), so waiting on it would leave
      // "Last seen …" stale until a page reload — this makes it live.
      onlineUserIds.forEach(id=>{
        if(!newOnline.has(id)){
          const p = myConversations.find(c=>c.id===id);
          if(p) p.lastSeenAt = new Date().toISOString();
        }
      });
      onlineUserIds = newOnline;
      patchPresenceUI();
    })
    .subscribe((status)=>{ if(status==='SUBSCRIBED') presenceChannel.track({ online_at: new Date().toISOString() }); });

  stampLastSeen();
  lastSeenHeartbeat = setInterval(stampLastSeen, 45000);
  document.addEventListener('visibilitychange', handleVisibilityForLastSeen);

  // "Last seen 1m ago" needs to keep advancing to "2m ago", "5m ago"...
  // on its own — otherwise it's frozen at whatever it said on the last
  // presence change until the page is reloaded.
  presenceLabelRefresh = setInterval(patchPresenceUI, 30000);
}

function handleVisibilityForLastSeen(){
  if(document.hidden) stampLastSeen();
}

function stampLastSeen(){
  if(!state.session) return;
  sb.from('profiles').update({ last_seen_at: new Date().toISOString() }).eq('id', state.session.user.id).then(()=>{});
}

function stopPresence(){
  if(presenceChannel){ sb.removeChannel(presenceChannel); presenceChannel = null; }
  if(lastSeenHeartbeat){ clearInterval(lastSeenHeartbeat); lastSeenHeartbeat = null; }
  if(presenceLabelRefresh){ clearInterval(presenceLabelRefresh); presenceLabelRefresh = null; }
  document.removeEventListener('visibilitychange', handleVisibilityForLastSeen);
  onlineUserIds = new Set();
}

// "Online" (from Presence) beats "Last seen …" (from the stamped column);
// blank if neither is known yet (e.g. still loading).
function presenceLabel(id, lastSeenAt){
  if(onlineUserIds.has(id)) return '🟢 Online';
  if(lastSeenAt) return 'Last seen ' + relativeTime(lastSeenAt);
  return '';
}

// A presence "sync" fires whenever ANYONE's online status changes
// anywhere on the site — not just the person I'm currently talking to —
// so this has to be a light, targeted patch rather than renderChatDock().
// Rebuilding the whole dock on every stranger's connect/disconnect is
// what made the open thread (input box included) look like it kept
// reloading.
function patchPresenceUI(){
  if(!chatWidgetOpen) return;
  if(chatWidgetView==='inbox'){
    myConversations.forEach(c=>{
      const wrap = document.getElementById(`chatAvatarWrap-${c.id}`);
      if(wrap){
        const online = onlineUserIds.has(c.id);
        const existingDot = wrap.querySelector('.chat-online-dot');
        if(online && !existingDot){
          const dot = document.createElement('span');
          dot.className = 'chat-online-dot';
          dot.style.cssText = 'position:absolute; bottom:-1px; right:-1px; width:10px; height:10px; border-radius:50%; background:#2ecc71; border:2px solid var(--bg2);';
          wrap.appendChild(dot);
        }else if(!online && existingDot){
          existingDot.remove();
        }
      }
      // Only refresh the preview text when it's currently showing a
      // presence label (not a real message or a "typing…" ping) —
      // otherwise this would stomp on those.
      if(!c.typing && !c.lastMessage) patchInboxRowPreview(c.id);
    });
  }else if(chatWidgetView==='thread'){
    const otherId = state.profile?.role==='teacher' ? chatStudentId : chatTeacherId;
    const convo = myConversations.find(c=>c.id===otherId);
    const presence = presenceLabel(otherId, convo?.lastSeenAt);
    const el = document.getElementById('chatThreadPresence');
    if(el){ el.textContent = presence; el.style.display = presence ? '' : 'none'; }
  }
}

// A short, synthesized "ping" for an incoming message — no audio file
// needed. Browsers block audio until the page has seen some user
// interaction, which is already true by the time someone's logged in and
// using the site, but the try/catch keeps this harmless if it's ever
// blocked anyway.
function playPingSound(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(880, audioCtx.currentTime);
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.16, audioCtx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.28);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + 0.28);
  }catch(err){ /* audio unavailable/blocked — fine to skip silently */ }
}

// A distinct two-note chime for a teacher's notification landing (fee
// reminders, batch updates, new assessment marks, trial responses) — kept
// deliberately different in shape from the chat ping above (which is a
// single quick blip) so the two are easy to tell apart by ear alone.
function playNotifSound(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    [ [660, now], [990, now + 0.14] ].forEach(([freq, at])=>{
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(freq, at);
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.14, at + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 0.22);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(at); o.stop(at + 0.22);
    });
  }catch(err){ /* audio unavailable/blocked — fine to skip silently */ }
}

// Persistent, session-wide channel (named after my own id) that receives
// "typing" pings addressed to me from anyone — not just while I have their
// specific thread open — so the inbox list can show "typing…" against the
// right conversation even while I'm just browsing the inbox (or elsewhere
// on the site).
function startInboxTypingChannel(){
  if(inboxTypingChannel || !state.session) return;
  const uid = state.session.user.id;
  inboxTypingChannel = sb.channel(`inbox-typing-${uid}`)
    .on('broadcast', {event:'typing'}, (payload)=>{ if(payload.payload?.from) markTyping(payload.payload.from); })
    .subscribe();
}

function stopInboxTypingChannel(){
  if(inboxTypingChannel){ sb.removeChannel(inboxTypingChannel); inboxTypingChannel = null; }
}

// Flags a conversation as "they're typing", auto-clearing after a pause.
// If it's the thread currently open, also drives the inline indicator
// under the messages — done as a targeted DOM patch (renderChatTypingIndicator)
// rather than a full re-render, so it doesn't disturb whatever's being typed
// in the reply box. If the inbox list is what's open, a full re-render is
// fine there (nothing to disturb).
function markTyping(fromId){
  let p = myConversations.find(c=>c.id===fromId);
  let isNewRow = false;
  if(!p){ p = { id:fromId, name:'Someone', lastMessage:null, lastAt:null, lastMine:false, unread:false, lastSeenAt:null, typing:false }; myConversations.unshift(p); isNewRow = true; }
  p.typing = true;
  clearTimeout(p._typingTimer);
  // Only a brand-new row needs the whole inbox list rebuilt (it doesn't
  // exist in the DOM yet). An existing row is patched in place below —
  // and same here, when the "typing…" clears after the pause.
  p._typingTimer = setTimeout(()=>{
    p.typing = false;
    if(chatWidgetOpen && chatWidgetView==='inbox') patchInboxRowPreview(p.id);
  }, 3000);

  const openOtherId = state.profile?.role==='teacher' ? chatStudentId : chatTeacherId;
  if(chatWidgetOpen && chatWidgetView==='thread' && fromId===openOtherId){
    chatOtherTyping = true;
    renderChatTypingIndicator();
    clearTimeout(chatTypingHideTimer);
    chatTypingHideTimer = setTimeout(()=>{ chatOtherTyping = false; renderChatTypingIndicator(); }, 3000);
  }
  if(chatWidgetOpen && chatWidgetView==='inbox'){
    // A typing ping arrives roughly every 1.5s for as long as the other
    // person keeps typing. Calling renderChatDock() here would replace the
    // *entire* dock's innerHTML on that same cadence — tearing down and
    // rebuilding every row, losing scroll position, and making the whole
    // message box look like it's continuously reloading. Patch just the
    // one row's preview text instead; only a genuinely new row (handled
    // above) needs a full rebuild.
    if(isNewRow) renderChatDock();
    else patchInboxRowPreview(p.id);
  }
}

// Updates a single inbox row's preview line ("typing…" / last message /
// presence) in place, without touching the rest of the list.
function patchInboxRowPreview(id){
  const c = myConversations.find(x=>x.id===id);
  const el = document.getElementById(`chatRowPreview-${id}`);
  if(!c || !el) return;
  el.innerHTML = c.typing ? `<span style="color:var(--amber); font-weight:700;">typing…</span>`
    : (c.lastMessage ? escapeHtml((c.lastMine?'You: ':'') + c.lastMessage) : (presenceLabel(c.id, c.lastSeenAt) || 'Say hello 👋'));
}

// Updates one existing inbox row for a freshly-arrived message — preview
// text, date, bold/unread state, and moves it to the top of the list —
// without touching any other row. This is what keeps the inbox from
// visibly "reloading" every time a message comes in while it's open; only
// a genuinely new conversation (no row to patch yet) needs a full rebuild.
function patchInboxRowForNewMessage(id){
  const c = myConversations.find(x=>x.id===id);
  const row = document.getElementById(`chatRow-${id}`);
  if(!c || !row) return;
  patchInboxRowPreview(id);
  row.style.background = c.unread ? 'var(--divider-soft)' : '';
  const nameEl = document.getElementById(`chatRowName-${id}`);
  if(nameEl) nameEl.style.fontWeight = c.unread ? '700' : '600';
  const dateEl = document.getElementById(`chatRowDate-${id}`);
  if(dateEl && c.lastAt){ dateEl.textContent = new Date(c.lastAt).toLocaleDateString(undefined,{day:'numeric',month:'short'}); dateEl.style.display = ''; }
  const dotEl = document.getElementById(`chatRowDot-${id}`);
  if(dotEl) dotEl.style.display = c.unread ? '' : 'none';
  const list = row.parentElement;
  if(list && list.firstElementChild !== row) list.prepend(row);
}

// Marks every not-yet-read message FROM otherId TO me as read, persisted
// in the database (via the mark_messages_read function — see README for
// the migration) so it survives a refresh, unlike the old broadcast-only
// "seen" ping which forgot everything the moment either side reloaded.
// The sender finds out live through the messages realtime subscription's
// UPDATE handler below, not through this call directly.
function markThreadRead(otherId){
  if(!otherId || !state.session) return;
  sb.rpc('mark_messages_read', { other_id: otherId }).then(({error})=>{
    if(error) console.error('Failed to mark messages read', error);
  });
}

// The channel I send my own typing pings on, pointed at whichever thread
// is currently open.
function subscribeOutgoingTypingChannel(otherId){
  teardownOutgoingTypingChannel();
  chatOutgoingTypingChannel = sb.channel(`inbox-typing-${otherId}`).subscribe();
}

function teardownOutgoingTypingChannel(){
  if(chatOutgoingTypingChannel){ sb.removeChannel(chatOutgoingTypingChannel); chatOutgoingTypingChannel = null; }
  clearTimeout(chatTypingHideTimer); chatTypingHideTimer = null;
  chatOtherTyping = false;
}

// Bound to the chat input's oninput — throttled so it broadcasts at most
// roughly once every 1.5s while someone's actively typing, not on every
// keystroke.
function handleChatTyping(){
  if(!chatOutgoingTypingChannel) return;
  const now = Date.now();
  if(now - chatTypingSentAt < 1500) return;
  chatTypingSentAt = now;
  chatOutgoingTypingChannel.send({ type:'broadcast', event:'typing', payload:{ from: state.session.user.id } });
}

function renderChatTypingIndicator(){
  const el = document.getElementById('chatTypingIndicator');
  if(el) el.style.display = chatOtherTyping ? 'block' : 'none';
}

// Resets all chat-widget state — called on logout, so the next person to
// use this browser doesn't see a stale conversation list or an open thread.
function resetChatWidget(){
  teardownSessionRealtime();
  teardownOutgoingTypingChannel();
  stopInboxTypingChannel();
  stopPresence();
  myConversations = []; conversationsStatus = 'idle';
  chatWidgetOpen = false; chatWidgetView = 'inbox';
  chatMessages = []; chatStatus = 'idle';
  chatTeacherId = null; chatStudentId = null; chatOtherName = ''; chatReplyTarget = null;
}

function toggleChatWidget(){
  chatWidgetOpen = !chatWidgetOpen;
  if(chatWidgetOpen && chatWidgetView==='thread' && chatTeacherId){
    subscribeOutgoingTypingChannel(state.profile.role==='teacher' ? chatStudentId : chatTeacherId);
    scrollChatToBottom();
  }else{
    teardownOutgoingTypingChannel();
    if(chatWidgetOpen){
      // Opening fresh from the bubble: if there's exactly one conversation
      // with a new message waiting (the common case — that's what the
      // badge on the bubble was for), jump straight into that thread
      // instead of making the person tap through the inbox first. With
      // more than one unread conversation, fall back to the inbox so they
      // can pick which one.
      const unread = myConversations.filter(c=>c.unread);
      if(unread.length===1){
        openThread(unread[0].id);
        return; // openThread() renders the dock itself
      }
      chatWidgetView = 'inbox';
    }
  }
  renderChatDock();
}

// Opens a specific thread — either from the inbox list, or directly from
// one of the "💬 Chat" buttons elsewhere on the site (teacher profile,
// dashboards). otherId is whichever id ISN'T me: the student id if I'm a
// teacher, the teacher id if I'm a student.
function openThread(otherId, fallbackName){
  const convo = myConversations.find(c=>c.id===otherId);
  chatWidgetOpen = true;
  chatWidgetView = 'thread';
  chatOtherName = convo?.name || fallbackName || 'them';
  if(state.profile.role==='teacher'){ chatTeacherId = state.session.user.id; chatStudentId = otherId; }
  else { chatTeacherId = otherId; chatStudentId = state.session.user.id; }
  if(convo){ convo.unread = false; convo.typing = false; clearTimeout(convo._typingTimer); }
  chatMessages = [];
  chatStatus = 'loading';
  chatReplyTarget = null;
  renderChatDock();
  loadChatMessages();
  subscribeOutgoingTypingChannel(otherId);
  ensureConversations(); // picks up the real record if this thread already exists, without dropping the optimistic one above if it doesn't yet
}

// Called by every "💬 Chat" button elsewhere on the site.
function openChat(teacherId, studentId, otherName){
  const otherId = state.profile?.role==='teacher' ? studentId : teacherId;
  if(!myConversations.some(c=>c.id===otherId)){
    myConversations.unshift({ id:otherId, name: otherName || 'them', lastMessage:null, lastAt:null, lastMine:false, unread:false, typing:false });
  }
  openThread(otherId, otherName);
}

function backToInbox(){
  teardownOutgoingTypingChannel();
  chatWidgetView = 'inbox';
  chatTeacherId = null; chatStudentId = null; chatReplyTarget = null;
  renderChatDock();
}

async function loadChatMessages(){
  try{
    const { data, error } = await sb.from('messages').select('*')
      .eq('teacher_id', chatTeacherId).eq('student_id', chatStudentId)
      .order('created_at', {ascending:true});
    if(error) throw error;
    chatMessages = data;
    chatStatus = 'ready';
  }catch(err){
    console.error('Failed to load messages', err);
    chatStatus = 'error';
  }
  if(chatWidgetView!=='thread') return; // navigated away from this thread before the fetch resolved
  renderChatDock();
  scrollChatToBottom();
  markThreadRead(state.profile?.role==='teacher' ? chatStudentId : chatTeacherId);
}

function scrollChatToBottom(){
  const el = document.getElementById('chatMessagesList');
  if(el) el.scrollTop = el.scrollHeight;
}

// Re-renders the whole message list (not the rest of the widget) — used
// for the initial load of a thread and when the "Seen" marker needs to
// jump to a different message. For a single new incoming message, use
// appendChatMessage() instead (see below) so the box doesn't visibly
// reload on every message.
function renderChatMessagesList(){
  const el = document.getElementById('chatMessagesList');
  if(!el) return;
  el.innerHTML = chatMessagesHTML();
  el.scrollTop = el.scrollHeight;
}

// Appends exactly the one new message to the open thread's DOM instead of
// re-rendering the whole list. Replacing the full innerHTML on every
// incoming message was what made the message box look like it reloaded
// each time a message came in — this keeps everything else in the list
// untouched.
function appendChatMessage(m){
  const el = document.getElementById('chatMessagesList');
  if(!el) return;
  if(!el.querySelector('.chat-msg-row')){
    // Nothing rendered yet (e.g. the "No messages yet" placeholder is
    // still showing) — nothing to append to, so do one full swap.
    el.innerHTML = chatMessagesHTML();
    el.scrollTop = el.scrollHeight;
    return;
  }
  const myId = state.session?.user?.id;
  const { lastSeenMineIdx } = seenBoundary(myId);
  const newIdx = chatMessages.length - 1;
  // The message right before this one is no longer the last in the list —
  // if it groups into the same burst as this new one, hide its timestamp
  // now that this one is showing it instead.
  if(newIdx > 0){
    const prevIdx = newIdx - 1;
    const prev = chatMessages[prevIdx];
    const prevMeta = document.getElementById(`chatMsgMeta-${prev.id}`);
    if(prevMeta){
      const prevSeenHere = prev.sender_id===myId && prevIdx===lastSeenMineIdx;
      prevMeta.style.display = chatShowsMeta(prevIdx, prevSeenHere) ? '' : 'none';
    }
  }
  el.insertAdjacentHTML('beforeend', chatMessageRowHTML(m, newIdx, myId, lastSeenMineIdx));
  el.scrollTop = el.scrollHeight;
}

// Index of the most recent message of mine that's actually been read
// (its persisted read_at is set) — that's where the "Seen" marker
// belongs, even if I've sent newer messages since that haven't been read
// yet. Driven entirely by data that came back from the database, so it's
// correct again immediately after a refresh, unlike the old
// broadcast-only version which forgot everything on reload.
function seenBoundary(myId){
  let lastSeenMineIdx = -1;
  chatMessages.forEach((m,i)=>{ if(m.sender_id===myId && m.read_at) lastSeenMineIdx = i; });
  return { lastSeenMineIdx };
}

// Consecutive messages from the same sender sent within this window count
// as one "burst" — only the last message in a burst shows its timestamp,
// so firing off 3-4 messages in a row doesn't repeat the same time under
// every single one.
const CHAT_GROUP_WINDOW_MS = 3 * 60 * 1000;

// Whether message index i should show its time/Seen line: always for the
// line that's actually carrying "Seen", always for the last message in
// the thread, and otherwise only when the next message is from someone
// else or arrived more than CHAT_GROUP_WINDOW_MS later.
function chatShowsMeta(i, seenHere){
  if(seenHere) return true;
  if(i === chatMessages.length - 1) return true;
  const cur = chatMessages[i], next = chatMessages[i+1];
  if(!next || cur.sender_id !== next.sender_id) return true;
  return (new Date(next.created_at) - new Date(cur.created_at)) > CHAT_GROUP_WINDOW_MS;
}

// Renders one message row — shared by the full-list render and by
// appendChatMessage(), so a message looks identical whichever path drew it.
function chatMessageRowHTML(m, i, myId, lastSeenMineIdx){
  const mine = m.sender_id === myId;
  const seenHere = mine && i===lastSeenMineIdx;
  const showMeta = chatShowsMeta(i, seenHere);
  const quoted = m.reply_to ? chatMessages.find(x=>x.id===m.reply_to) : null;
  const quoteHtml = !m.reply_to ? '' : quoted
    ? `<div class="muted" data-action="scroll-to-message" data-id="${quoted.id}" style="background:${mine?'rgba(255,255,255,0.18)':'rgba(0,0,0,0.06)'}; border-left:3px solid ${mine?'rgba(255,255,255,0.75)':'var(--primary)'}; border-radius:6px; padding:4px 8px; margin-bottom:5px; cursor:pointer; color:inherit;">
         <div style="font-weight:700; font-size:10.5px; opacity:.95;">${quoted.sender_id===myId ? 'You' : escapeHtml(chatOtherName)}</div>
         <div style="font-size:11px; opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(quoted.body.length>60 ? quoted.body.slice(0,60)+'…' : quoted.body)}</div>
       </div>`
    : `<div style="font-size:11px; opacity:.75; font-style:italic; margin-bottom:5px;">Replied to a message</div>`;
  const replyBtn = `<button type="button" class="chat-msg-reply-btn" data-action="reply-to-message" data-id="${m.id}" title="Reply" aria-label="Reply to this message">↩</button>`;
  return `<div class="chat-msg-row" style="display:flex; align-items:flex-end; gap:2px; justify-content:${mine?'flex-end':'flex-start'};">
    ${mine ? replyBtn : ''}
    <div style="max-width:82%; min-width:0;">
      <div id="chatMsg-${m.id}" style="background:${mine?'var(--primary)':'var(--divider-soft)'}; color:${mine?'#fff':'var(--text)'}; padding:8px 12px; border-radius:14px; ${mine?'border-bottom-right-radius:4px;':'border-bottom-left-radius:4px;'} font-size:13px; line-height:1.5; word-break:break-word;">${quoteHtml}${escapeHtml(m.body)}</div>
      <div id="chatMsgMeta-${m.id}" class="muted" style="font-size:10px; margin-top:3px; text-align:${mine?'right':'left'}; display:${showMeta?'':'none'};">${new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}${seenHere ? ' · <span style="color:var(--primary); font-weight:700;">Seen</span>' : ''}</div>
    </div>
    ${!mine ? replyBtn : ''}
  </div>`;
}

function chatMessagesHTML(){
  if(chatStatus==='loading') return `<div style="display:flex; flex-direction:column; gap:10px; width:100%; padding:0 4px;">
    <div class="skel skel-line" style="width:60%; align-self:flex-start; height:30px; border-radius:14px;"></div>
    <div class="skel skel-line" style="width:45%; align-self:flex-end; height:30px; border-radius:14px;"></div>
    <div class="skel skel-line" style="width:55%; align-self:flex-start; height:30px; border-radius:14px;"></div>
  </div>`;
  if(chatStatus==='error') return `<p class="muted" style="text-align:center; font-size:13px; margin:auto;">Couldn't load messages — try reopening the chat.</p>`;
  if(!chatMessages.length) return `<p class="muted" style="text-align:center; font-size:13px; margin:auto;">No messages yet — say hello 👋</p>`;
  const myId = state.session?.user?.id;
  const { lastSeenMineIdx } = seenBoundary(myId);
  return chatMessages.map((m,i)=> chatMessageRowHTML(m, i, myId, lastSeenMineIdx)).join('');
}

// Sets up "replying to" state and shows the preview banner above the
// input — a targeted patch (renderChatReplyBanner), not a full re-render,
// so it doesn't disturb the message list or steal input focus.
function startReplyTo(id){
  const m = chatMessages.find(x=>String(x.id)===String(id));
  if(!m) return;
  chatReplyTarget = { id:m.id, senderId:m.sender_id, body:m.body };
  renderChatReplyBanner();
  const input = document.getElementById('chatInput');
  if(input) input.focus();
}

function cancelReply(){
  chatReplyTarget = null;
  renderChatReplyBanner();
}

function chatReplyBannerContent(){
  if(!chatReplyTarget) return '';
  const myId = state.session?.user?.id;
  return `<div style="flex:1; min-width:0;">
      <div style="font-weight:700; color:var(--primary); font-size:11px;">Replying to ${chatReplyTarget.senderId===myId ? 'yourself' : escapeHtml(chatOtherName)}</div>
      <div class="muted" style="font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(chatReplyTarget.body)}</div>
    </div>
    <span style="cursor:pointer; font-size:16px; color:var(--text-dim); flex-shrink:0;" data-action="cancel-reply" aria-label="Cancel reply">&times;</span>`;
}

function renderChatReplyBanner(){
  const el = document.getElementById('chatReplyBanner');
  if(!el) return;
  el.style.display = chatReplyTarget ? 'flex' : 'none';
  el.innerHTML = chatReplyBannerContent();
}

// Scrolls the quoted original message into view and briefly highlights it,
// so tapping a reply quote actually takes you to what it was replying to.
function scrollToMessage(id){
  const el = document.getElementById(`chatMsg-${id}`);
  if(!el) return;
  el.scrollIntoView({behavior:'smooth', block:'center'});
  el.classList.add('chat-msg-highlight');
  setTimeout(()=> el.classList.remove('chat-msg-highlight'), 900);
}

  const r = myPendingEnrollmentRequests.find(x=>x.enrollmentId===enrollmentId);

  const matching = myBatches.filter(b=>b.subject===r.subject);

  return `<div class="glass modal">
    <h3 style="font-size:18px; margin-bottom:4px;">Accept enrollment — ${escapeHtml(r.name)}</h3>
    <p class="muted" style="font-size:13px; margin-bottom:18px;">${escapeHtml(r.subject)}${r.schedule?' · '+escapeHtml(r.schedule):''} · ₹${r.fee}</p>
    <div class="field"><label class="field-label">Add ${escapeHtml(r.name)} to a batch</label>
      <select class="input" id="aeBatch">
        <option value="">Don't add to a batch now</option>
        ${matching.map(b=>`<option value="${b.id}">${escapeHtml(b.name)} (${escapeHtml(b.subject)})</option>`).join('')}
        ${other.length ? `<optgroup label="Other subjects">${other.map(b=>`<option value="${b.id}">${escapeHtml(b.name)} (${escapeHtml(b.subject)})</option>`).join('')}</optgroup>` : ''}

    ${!myBatches.length ? `<p class="muted" style="font-size:12px; margin-top:-8px;">You haven't created any batches yet — you can still accept now and add ${escapeHtml(r.name)} to a batch later from the Batches tab.</p>` : ''}

      <button class="btn btn-ghost btn-block" data-action="close-modal">Cancel</button>

}

// Forgot-password flow: step 1 collects the email and asks Supabase to
// email a 6-digit code; step 2 collects that code plus a new password.
// fpEmail is remembered between the two steps (and for "Resend code")
// without needing to touch the main app state.
let fpEmail = '';
// Lets the already-logged-in admin change their own password from the
// admin panel, without needing README "Part 7" or a Supabase dashboard
// visit. Asks for the current password first (re-checked against Supabase
// via signInWithPassword) so someone who walks up to an already-open
// browser tab can't silently take over the account.
function adminChangePasswordModal(){
  return `<div class="glass modal">
    <h3 style="font-size:18px; margin-bottom:4px;">Change admin password</h3>
    <p class="muted" style="font-size:13px; margin-bottom:18px;">This updates the real password Supabase checks for the admin account.</p>
    <div class="field"><label class="field-label">Current password</label><input class="input" id="acpCurrent" type="password" placeholder="••••••••"/></div>
    <div class="field"><label class="field-label">New password</label><input class="input" id="acpNew" type="password" placeholder="••••••••"/></div>
    <div class="field"><label class="field-label">Confirm new password</label><input class="input" id="acpConfirm" type="password" placeholder="••••••••"/></div>
    <div class="field"><label class="field-label">Secret code</label><input class="input" id="acpSecret" type="password" placeholder="••••••••"/>
      <p class="muted" style="font-size:12px; margin-top:6px;">Only whoever is authorized to change this password should know it.</p>
    </div>
    <div style="display:flex; gap:10px; margin-top:6px;">
      <button class="btn btn-ghost btn-block" data-action="close-modal">Cancel</button>
      <button class="btn btn-primary btn-block" data-action="admin-change-password-confirm">Update password</button>
    </div>
  </div>`;
}

async function changeAdminPassword(currentPassword, newPassword, confirmPassword, secretCode){
  if(!currentPassword || !newPassword || !confirmPassword || !secretCode) return toast('Please fill in all fields', 'warn');
  if(secretCode !== ADMIN_SECRET_CODE) return toast('❌ Incorrect secret code', 'err');
  if(newPassword.length < 6) return toast('Password must be at least 6 characters', 'warn');
  if(newPassword !== confirmPassword) return toast("New passwords don't match", 'warn');
  // Re-verify the current password before changing anything — this call
  // itself doesn't disturb the existing admin session on success (Supabase
  // just re-confirms the same account), and fails cleanly if it's wrong.
  const { error: verifyError } = await sb.auth.signInWithPassword({ email: ADMIN_EMAIL, password: currentPassword });
  if(verifyError) return toast('❌ Current password is incorrect', 'err');
  const { error: updateError } = await sb.auth.updateUser({ password: newPassword });
  if(updateError) return toast('❌ ' + updateError.message, 'err');
  closeModal();
  toast('✅ Admin password updated', 'ok');
}

        <a style="color:var(--primary); font-weight:600; cursor:pointer;" data-action="forgot-password-back">Try a different email</a>

    </div>`;
  }
  if(step==='verify'){
    return `<div class="glass modal">
      <h3 style="font-size:18px; margin-bottom:4px;">Enter your code</h3>
      <p class="muted" style="font-size:13px; margin-bottom:18px;">We sent a 6-digit code to <strong>${fpEmail}</strong>. Enter it below along with your new password.</p>
      <div class="field"><label class="field-label">6-digit code</label><input class="input" id="fpCode" placeholder="123456" inputmode="numeric" maxlength="6"/></div>
      <div class="field"><label class="field-label">New password</label><input class="input" id="fpNewPassword" placeholder="••••••••" type="password"/></div>

        Didn't get a code? <a style="color:var(--primary); font-weight:600; cursor:pointer;" data-action="forgot-password-resend">Resend</a>
        &nbsp;·&nbsp;
        <a style="color:var(--primary); font-weight:600; cursor:pointer;" data-action="forgot-password-back">Use a different email</a>

  return `<div class="glass modal">

    <div style="display:flex; gap:10px; margin-top:6px;">

      <button class="btn btn-primary btn-block" data-action="forgot-password-send">Send code</button>
    </div>
  </div>`;

const NEEDS_TEACHERS = new Set(['home','browse','teacherProfile']);

function render(){
  if(!isConfigured()){ document.getElementById('app').innerHTML = setupMissingScreen(); return; }
  if(state.maintenanceMode && state.profile?.role!=='admin'){
    document.getElementById('app').innerHTML = viewMaintenance();
    renderChatDock();
    renderNotifDrawer();
    return;
  }
  if(state.session && awaitingOAuthName){
    document.getElementById('app').innerHTML = viewOAuthNamePrompt();
    return;
  }
  const views = {
    home: viewHome, browse: viewBrowse, teacherProfile: viewTeacherProfile,
    studentAuth: viewStudentAuth, studentDashboard: viewStudentDashboard,
    teacherHome: viewTeacherHome, teacherAuth: viewTeacherAuth, teacherDashboard: viewTeacherDashboard,
    teacherOnboarding: viewTeacherOnboarding,
    adminAuth: viewAdminAuth, adminDashboard: viewAdminDashboard,
  };
  let html;
  if(NEEDS_TEACHERS.has(state.view) && teachersStatus !== 'ready'){
    html = navbar() + (teachersStatus === 'error' ? errorScreen('teachers') : loadingScreen('teachers'));
  }else if(state.view==='studentDashboard' && state.session && state.profile?.role==='student' && studentDataStatus==='idle'){
    ensureStudentData(); // status was reset (e.g. by a background auth refresh) — refetch instead of showing a permanent loader
    html = navbar() + loadingScreen('your dashboard');
  }else if(state.view==='teacherDashboard' && state.session && state.profile?.role==='teacher' && teacherDataStatus==='idle'){
    ensureTeacherData();
    html = navbar() + loadingScreen('your dashboard');
  }else if(state.view==='adminDashboard' && state.session && state.profile?.role==='admin' && adminDataStatus==='idle'){
    ensureAdminData();
    html = navbar() + loadingScreen('the admin panel');
  }else{
    html = views[state.view]();
  }
  document.getElementById('app').innerHTML = html;
  renderChatDock();
  renderNotifDrawer();
}

document.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  switch(action){
    case 'go-home':
      if(state.session && state.profile?.role==='teacher') nav('teacherDashboard');
      else if(state.session && state.profile?.role==='student') nav('home');
      else nav(state.portal==='customer' ? 'home' : 'teacherHome');
      break;
    case 'go':
      if(el.dataset.mode && el.dataset.view==='teacherAuth') state.teacherAuthMode = el.dataset.mode;
      if(el.dataset.mode && el.dataset.view==='studentAuth') state.studentAuthMode = el.dataset.mode;
      if(el.dataset.view==='studentAuth' || el.dataset.view==='teacherAuth') captureAuthRedirect();
      nav(el.dataset.view); break;
    case 'switch-portal':
      state.portal = el.dataset.portal;
      nav(state.portal==='customer' ? 'home' : (state.session && state.profile?.role==='teacher' ? 'teacherDashboard' : 'teacherHome'));
      break;
    case 'go-admin':
      nav(state.session && state.profile?.role==='admin' ? 'adminDashboard' : 'adminAuth');
      break;
    case 'toggle-maintenance':
      setBtnLoading(el, true);
      setMaintenanceMode(!state.maintenanceMode).finally(()=>setBtnLoading(el, false));
      break;
    case 'login-admin':
      setBtnLoading(el, true);
      signInAdmin(document.getElementById('adUsername').value, document.getElementById('adPassword').value).finally(()=>setBtnLoading(el, false));
      break;
    case 'forgot-password':
      fpEmail = '';
      openModal(forgotPasswordModal('request'));
      break;
    case 'forgot-password-send':
      setBtnLoading(el, true);
      requestPasswordReset(document.getElementById('fpEmail').value.trim()).finally(()=>setBtnLoading(el, false));
      break;
    case 'forgot-password-resend':
      setBtnLoading(el, true);
      requestPasswordReset(fpEmail).finally(()=>setBtnLoading(el, false));
      break;
    case 'forgot-password-back':
      openModal(forgotPasswordModal('request'));
      break;
    case 'forgot-password-signup':
      closeModal();
      if(state.portal==='teacher'){ state.teacherAuthMode = 'signup'; nav('teacherAuth'); }
      else{ state.studentAuthMode = 'signup'; nav('studentAuth'); }
      break;
    case 'forgot-password-confirm':
      setBtnLoading(el, true);
      confirmPasswordReset(
        document.getElementById('fpCode').value.trim(),
        document.getElementById('fpNewPassword').value,
        document.getElementById('fpConfirmPassword').value
      ).finally(()=>setBtnLoading(el, false));
      break;
    case 'admin-change-password':
      openModal(adminChangePasswordModal());
      break;
    case 'admin-change-password-confirm':
      setBtnLoading(el, true);
      changeAdminPassword(
        document.getElementById('acpCurrent').value,
        document.getElementById('acpNew').value,
        document.getElementById('acpConfirm').value,
        document.getElementById('acpSecret').value
      ).finally(()=>setBtnLoading(el, false));
      break;
    case 'admin-tab':
      state.adminTab = el.dataset.tab;
      render();
      break;
    case 'admin-enroll-filter':
      state.adminEnrollFilter = el.dataset.filter;
      render();
      break;
    case 'export-enrollments-csv': {
      const header = ['Student','Teacher','Subject','Fee','Status','Enrolled on'];
      const rows = ADMIN_ENROLLMENTS.map(e=>[e.studentName, e.teacherName, e.subject, e.fee||0, e.status, new Date(e.created_at).toLocaleDateString()]);
      const csv = [header, ...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type:'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'nearpath-tutors-enrollments.csv'; a.click();
      URL.revokeObjectURL(url);
      break;
    }
    case 'send-broadcast': {
      const audience = document.getElementById('bcAudience').value;
      const title = document.getElementById('bcTitle').value.trim();
      const message = document.getElementById('bcMessage').value.trim();
      if(!title){ toast('Please enter a title', 'warn'); return; }
      setBtnLoading(el, true);
      (async ()=>{
        try{
          if(audience==='students' || audience==='everyone'){
            const rows = ADMIN_STUDENTS.map(s=>({ student_id:s.id, teacher_id:null, type:'admin_broadcast', title, message }));
            if(rows.length){
              const { error } = await sb.from('notifications').insert(rows);
              if(error) throw error;
            }
          }
          if(audience==='teachers' || audience==='everyone'){
            const rows = ADMIN_TEACHERS.map(t=>({ teacher_id:t.id, student_id:null, type:'admin_broadcast', title, message }));
            if(rows.length){
              const { error } = await sb.from('teacher_notifications').insert(rows);
              if(error) throw error;
            }
          }
          toast('📣 Broadcast sent', 'ok');
          document.getElementById('bcTitle').value = '';
          document.getElementById('bcMessage').value = '';
        }catch(err){
          toast('❌ ' + err.message, 'err');
        }finally{
          setBtnLoading(el, false);
        }
      })();
      break;
    }
    case 'refresh-site-logs':
      ensureSiteLogs(true);
      break;
    case 'clear-site-logs': {
      if(!confirm('Delete all logged errors? This cannot be undone.')) return;
      setBtnLoading(el, true);
      sb.from('site_logs').delete().gte('id', 0).then(({error})=>{
        if(error){ toast('❌ ' + error.message, 'err'); return; }
        siteLogs = [];
        lastDataError = null;
        toast('🗑️ Logs cleared', 'ok');
        render();
      }).finally(()=>setBtnLoading(el, false));
      break;
    }
    case 'admin-impersonate-user': {
      const name = el.dataset.name, id = el.dataset.id;
      if(!confirm(`Sign in as "${name}"? You'll see the site exactly as they do. Use "Return to admin" (top of the page) to come back.`)) return;
      setBtnLoading(el, true);
      impersonateUser(id, name).then(({error, role})=>{
        if(error){ toast('❌ ' + error, 'err'); return; }
        toast('🔑 Signed in as ' + name, 'ok');
        nav(role==='teacher' ? 'teacherDashboard' : 'studentDashboard');
      }).finally(()=>setBtnLoading(el, false));
      break;
    }
    case 'return-to-admin':
      setBtnLoading(el, true);
      returnToAdmin().finally(()=>setBtnLoading(el, false));
      break;
    case 'admin-delete-profile': {
      const name = el.dataset.name, role = el.dataset.role, id = el.dataset.id;
      if(!confirm(`Delete ${role} "${name}"? This permanently removes their login and all related data (listings, enrollments, payments, reviews). This cannot be undone.`)) return;
      setBtnLoading(el, true);
      // Calls the admin-delete-user Edge Function, which deletes the
      // Supabase Auth account itself (not just the profiles row). That
      // auth deletion cascades down to profiles and everything tied to
      // it, so the user is fully gone, not just logged-out-and-orphaned.
      sb.functions.invoke('admin-delete-user', { body: { id } }).then(({data, error})=>{
        if(error){ toast('❌ ' + error.message, 'err'); return; }
        if(data?.error){ toast('❌ ' + data.error, 'err'); return; }
        toast('🗑️ Removed ' + name, 'ok');
        adminDataStatus = 'idle';
        ensureAdminData();
        teachersStatus = 'idle'; // the removed teacher may be cached in the public listing too
      }).finally(()=>setBtnLoading(el, false));
      break;
    }
    case 'admin-delete-review': {
      const id = el.dataset.id;
      if(!confirm('Delete this review? This cannot be undone, and the teacher\'s average rating will be recalculated.')) return;
      setBtnLoading(el, true);
      sb.from('reviews').delete().eq('id', id).then(({error})=>{
        if(error){ toast('❌ ' + error.message, 'err'); return; }
        toast('🗑️ Review removed', 'ok');
        adminDataStatus = 'idle';
        ensureAdminData(true);
        teachersStatus = 'idle'; // the teacher's rating may have changed in the public listing too
      }).finally(()=>setBtnLoading(el, false));
      break;
    }
    case 'register-as-teacher':
      state.portal = 'teacher';
      if(state.session && state.profile?.role==='teacher'){
        nav('teacherDashboard');
      }else{
        state.teacherAuthMode = 'signup';
        nav('teacherAuth');
      }
      break;
    case 'filter-cat':
      state.filters.category = el.dataset.cat;

    case 'mark-attendance': {
      const batchId = parseInt(el.dataset.batch), studentId = el.dataset.student, status = el.dataset.status;
      const date = todayStr();
      const group = el.parentElement;
      group.querySelectorAll('[data-action="mark-attendance"]').forEach(btn=>{ btn.classList.remove('btn-primary'); btn.classList.add('btn-ghost'); });
      el.classList.remove('btn-ghost'); el.classList.add('btn-primary');
      sb.from('attendance').upsert({ batch_id: batchId, student_id: studentId, date, status }, { onConflict: 'batch_id,student_id,date' }).then(({error})=>{
        if(error){ toast('❌ ' + error.message, 'err'); return; }
        const arr = batchAttendance[batchId] || (batchAttendance[batchId]=[]);
        const idx = arr.findIndex(a=>a.studentId===studentId && a.date===date);
        if(idx!==-1) arr[idx].status = status; else arr.push({studentId, date, status});
        const countsEl = document.getElementById(`attCounts-${batchId}-${studentId}`);
        if(countsEl){
          const c = attendanceCounts(batchId, studentId);
          countsEl.textContent = `Present ${c.present} · Absent ${c.absent} · Late ${c.late}`;
        }
      });
      break;
    }
    case 'set-fee-status': {
      const enrollmentId = parseInt(el.dataset.enrollment), status = el.dataset.status;
      const group = el.parentElement;
      group.querySelectorAll('[data-action="set-fee-status"]').forEach(btn=>{ btn.classList.remove('btn-primary'); btn.classList.add('btn-ghost'); });
      el.classList.remove('btn-ghost'); el.classList.add('btn-primary');
      sb.from('enrollments').update({ status }).eq('id', enrollmentId).then(({error})=>{
        if(error){ toast('❌ ' + error.message, 'err'); return; }
        const ms = myStudents.find(x=>x.enrollmentId===enrollmentId);
        if(ms) ms.feeStatus = status;
        const badge = document.getElementById(`feeBadge-${el.dataset.batch}-${el.dataset.student}`);
        if(badge){
          badge.textContent = status.toUpperCase();
          badge.className = 'badge ' + (status==='paid'?'badge-green':status==='due'?'badge-amber':'badge-red');
        }
        toast('✅ Fee status updated', 'ok');
      });
      break;
    }
    case 'remove-batch-student': {
      const batchId = parseInt(el.dataset.batch), studentId = el.dataset.student;
      setBtnLoading(el, true);
      sb.from('batch_students').delete().eq('batch_id', batchId).eq('student_id', studentId).then(({error})=>{
        if(error){ toast('❌ ' + error.message, 'err'); return; }
        toast('Removed ' + el.dataset.name + ' from the batch', 'ok');
        ensureTeacherData(true);
      }).finally(()=>setBtnLoading(el, false));
      break;
    }
    case 'open-notify-batch':
      openModal(notifyBatchModal(parseInt(el.dataset.id)));
      break;
    case 'submit-notify-batch': {
      const batchId = parseInt(el.dataset.id);
      const b = myBatches.find(x=>x.id===batchId);
      const type = document.getElementById('nbType').value;
      const title = document.getElementById('nbTitle').value.trim();
      const message = document.getElementById('nbMessage').value.trim();
      if(!title){ toast('Please add a title', 'warn'); return; }
      if(!b.students.length){ toast('This batch has no students yet', 'warn'); return; }
      setBtnLoading(el, true);
      const rows = b.students.map(s=>({ student_id: s.id, teacher_id: state.session.user.id, batch_id: batchId, type, title, message }));
      sb.from('notifications').insert(rows).then(({error})=>{
        if(error){ toast('❌ ' + error.message, 'err'); return; }
        closeModal();
        toast('📣 Notified ' + b.students.length + ' student' + (b.students.length!==1?'s':''), 'ok');
      }).finally(()=>setBtnLoading(el, false));
      break;
    }
    case 'open-assessment-modal':
      openModal(assessmentModal(parseInt(el.dataset.id)));
      break;
    case 'submit-assessment': {
      const batchId = parseInt(el.dataset.id);
      const b = myBatches.find(x=>x.id===batchId);
      const title = document.getElementById('asTitle').value.trim();
      const maxMarksRaw = document.getElementById('asMaxMarks').value;
      const maxMarks = maxMarksRaw ? parseInt(maxMarksRaw) : 100;
      const subject = document.getElementById('asSubject').value.trim() || b.subject;
      const remarksByStudent = {};
      Array.from(document.querySelectorAll('.asRemarksInput')).forEach(inp=>{
        const v = inp.value.trim();
        if(v) remarksByStudent[inp.dataset.student] = v;
      });
      const entries = Array.from(document.querySelectorAll('.asMarkInput'))
        .map(inp=>({ studentId: inp.dataset.student, name: inp.dataset.name, marks: inp.value.trim(), remarks: remarksByStudent[inp.dataset.student] || '' }))
        .filter(x=>x.marks !== '');
      if(!title){ toast('Please add an assessment title', 'warn'); return; }
      if(!entries.length){ toast('Enter at least one student\'s marks', 'warn'); return; }
      setBtnLoading(el, true);
      (async ()=>{
        const { data: assessment, error: aErr } = await sb.from('assessments')
          .insert({ batch_id: batchId, teacher_id: state.session.user.id, subject, title, max_marks: maxMarks })
          .select().single();
        if(aErr) throw aErr;
        const markRows = entries.map(e=>({ assessment_id: assessment.id, student_id: e.studentId, marks: parseFloat(e.marks), remarks: e.remarks }));
        const { error: mErr } = await sb.from('assessment_marks').insert(markRows);
        if(mErr) throw mErr;
        const notifRows = entries.map(e=>({
          student_id: e.studentId, teacher_id: state.session.user.id, batch_id: batchId, type: 'assessment',
          title: `New marks: ${title}`, message: `You scored ${e.marks}/${maxMarks} in ${title} (${subject}).`,
        }));
        await sb.from('notifications').insert(notifRows);
        closeModal();
        toast('📝 Sent marks to ' + entries.length + ' student' + (entries.length!==1?'s':''), 'ok');
        if(state.selectedStudentProfileId) ensureStudentProfileDetail(state.selectedStudentProfileId, true);
      })().catch(err=>{
        toast('❌ ' + err.message, 'err');
      }).finally(()=>setBtnLoading(el, false));
      break;
    }
    case 'open-trial-respond':
      openModal(trialRespondModal(parseInt(el.dataset.id), el.dataset.status));
      break;
    case 'submit-trial-response': {
      const id = parseInt(el.dataset.id), status = el.dataset.status;
      const r = myTrialRequests.find(x=>x.id===id);
      const message = document.getElementById('trrMessage').value.trim();
      setBtnLoading(el, true);
      sb.from('trial_requests').update({ status, response_message: message, responded_at: new Date().toISOString() }).eq('id', id).then(async ({error})=>{
        if(error){ toast('❌ ' + error.message, 'err'); return; }
        if(r){
          await sb.from('notifications').insert({
            student_id: r.studentId, teacher_id: state.session.user.id, batch_id: r.batchId,
            type: status==='approved' ? 'trial_approved' : 'trial_declined',
            title: status==='approved' ? `Your trial for ${r.batchName} was approved!` : `Your trial request for ${r.batchName} was declined`,
            message,
          });
        }
        closeModal();
        toast(status==='approved' ? '✅ Trial approved' : 'Trial declined', status==='approved'?'ok':'info');
        ensureTeacherData(true);
      }).finally(()=>setBtnLoading(el, false));
      break;
    }
    case 'student-auth-mode':
      state.studentAuthMode = el.dataset.mode; render(); break;
    case 'teacher-auth-mode':
      state.teacherAuthMode = el.dataset.mode; render(); break;
    case 'oauth-name-confirm':
      setBtnLoading(el, true);
      completeOAuthSignup(document.getElementById('oauthName').value).finally(()=>setBtnLoading(el, false));
      break;
    case 'google-signin-student':
      setBtnLoading(el, true);
      captureAuthRedirect();
      signInWithGoogle('student').finally(()=>setBtnLoading(el, false));
      break;
    case 'google-signin-teacher':
      setBtnLoading(el, true);
      captureAuthRedirect();
      signInWithGoogle('teacher').finally(()=>setBtnLoading(el, false));
      break;
    case 'login-student':
      setBtnLoading(el, true);
      signInStudent(document.getElementById('suEmail').value, document.getElementById('suPassword').value).finally(()=>setBtnLoading(el, false));
      break;
    case 'signup-student':
      setBtnLoading(el, true);
      signUpStudent(document.getElementById('suName').value, document.getElementById('suEmail').value, document.getElementById('suPassword').value).finally(()=>setBtnLoading(el, false));
      break;
    case 'login-teacher':
      setBtnLoading(el, true);
      signInTeacher(document.getElementById('tuEmail').value, document.getElementById('tuPassword').value).finally(()=>setBtnLoading(el, false));
      break;
    case 'signup-teacher':
      setBtnLoading(el, true);
      signUpTeacher(document.getElementById('tuName').value, document.getElementById('tuEmail').value, document.getElementById('tuPassword').value).finally(()=>setBtnLoading(el, false));
      break;
    case 'logout':
      setBtnLoading(el, true);
      logout().finally(()=>setBtnLoading(el, false));
      break;
    case 'toggle-theme':
      toggleTheme(el);
      break;
    case 'teacher-tab':
      switchTeacherTab(el.dataset.tab);
      break;
    case 'copy-profile-link': {
      const link = location.origin + location.pathname + '?teacher=' + state.session.user.id;
      navigator.clipboard.writeText(link).then(()=>toast('🔗 Link copied to clipboard', 'ok'));
      break;
    }
    case 'save-profile':
      setBtnLoading(el, true);
      saveTeacherProfile().finally(()=>setBtnLoading(el, false));
      break;
    case 'save-profile-onboarding':
      setBtnLoading(el, true);
      saveTeacherProfileOnboarding().finally(()=>setBtnLoading(el, false));
      break;
    case 'skip-onboarding':
      nav('teacherDashboard');
      break;
    case 'use-my-location':
      useMyLocation();
      break;
    case 'onboarding-location-allow':
      useMyLocationOnboarding();
      break;
    case 'onboarding-location-skip':
      try{ localStorage.setItem('npt-location-declined', '1'); }catch(e){}
      closeModal();
      break;
    case 'teacher-set-location': {
      // Updates the DOM directly rather than calling render() — a full
      // re-render would regenerate this form from state.selectedTeacherProfile
      // and discard any other unsaved field edits the teacher has typed.
      if(!navigator.geolocation){ toast('Location isn\'t supported in this browser', 'warn'); break; }
      const btn = el;
      const originalLabel = btn.textContent;
      btn.disabled = true;
      btn.textContent = 'Locating…';
      navigator.geolocation.getCurrentPosition(
        (pos)=>{
          const latEl = document.getElementById('peLat');
          const lngEl = document.getElementById('peLng');
          const statusEl = document.getElementById('peLocStatus');
          if(latEl && lngEl){
            latEl.value = pos.coords.latitude;
            lngEl.value = pos.coords.longitude;
          }
          if(statusEl) statusEl.textContent = 'Location set — students will see their distance to you';
          btn.disabled = false;
          btn.textContent = originalLabel;
          toast('📍 Teaching location captured — remember to save changes', 'ok');
        },
        ()=>{
          btn.disabled = false;
          btn.textContent = originalLabel;
          toast('❌ Couldn\'t get your location — check permissions and try again', 'err');
        },
        { enableHighAccuracy:false, timeout:10000 }
      );
      break;
    }
    case 'open-review':
      openModal(reviewModal(parseInt(el.dataset.id)));
      break;
    case 'submit-review': {
      const enrollmentId = parseInt(el.dataset.enrollment);
      const teacherId = el.dataset.teacher;
      const rating = parseInt(document.getElementById('reviewRating').value);
      const comment = document.getElementById('reviewComment').value.trim();
      setBtnLoading(el, true);
      sb.from('reviews').upsert({
        teacher_id: teacherId, student_id: state.session.user.id, enrollment_id: enrollmentId,
        rating, comment,
      }, { onConflict: 'enrollment_id' }).then(({error})=>{
        if(error){ toast('❌ ' + error.message, 'err'); return; }
        closeModal();
        toast('✅ Thanks for the review!', 'ok');
        studentDataStatus = 'idle';
        ensureStudentData(true);
        ensureTeachers(true); // refresh the teacher's averaged rating everywhere it's shown
      }).finally(()=>setBtnLoading(el, false));
      break;
    }
    case 'open-pay':
      openModal(payModal());
      break;
    case 'confirm-pay':
      setBtnLoading(el, true);
      confirmPay(document.getElementById('payMethod').value).finally(()=>setBtnLoading(el, false));
      break;
    case 'retry-load': {
      setBtnLoading(el, true);
      const reloads = [ensureTeachers(true)];
      if(state.view==='studentDashboard') reloads.push(ensureStudentData(true));
      if(state.view==='teacherDashboard') reloads.push(ensureTeacherData(true));
      if(state.view==='adminDashboard') reloads.push(ensureAdminData(true));
      Promise.all(reloads).finally(()=>setBtnLoading(el, false));
      break;
    }
  }
});

// Delegated change handler for filter dropdowns (<select data-action="...">).
// Kept separate from the click delegation above since selects fire
// 'change', not 'click'.
document.addEventListener('change', (e)=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  switch(el.dataset.action){
    case 'students-fee-filter':
      state.studentsFilter = el.value === 'all' ? null : el.value;
      refreshTeacherPane();
      break;
    case 'students-batch-filter':
      state.studentsBatchFilter = el.value === 'all' ? null : el.value;
      refreshTeacherPane();
      break;
    case 'admin-set-fee-status': {
      const id = parseInt(el.dataset.id);
      const status = el.value;
      sb.from('enrollments').update({ status }).eq('id', id).then(({error})=>{
        if(error){ toast('❌ ' + error.message, 'err'); return; }
        toast('✅ Fee status updated', 'ok');
        ensureAdminData(true);
      });
      break;
    }
  }
});

async function loadOwnTeacherProfile(){
  const { data, error } = await sb.from('teacher_profiles').select('*, schedule_slots(day,time,subj)').eq('profile_id', state.session.user.id).single();
  if(error){ toast('❌ ' + error.message, 'err'); return; }
  state.selectedTeacherProfile = data;
  render();
}

async function saveTeacherProfile(){
  const uid = state.session.user.id;
  const payload = {
    category: document.getElementById('peCategory').value,
    subjects: document.getElementById('peSubjects').value.split(',').map(s=>s.trim()).filter(Boolean),
    location: document.getElementById('peLocation').value,
    maps_link: document.getElementById('peMapsLink').value.trim(),
    lat: document.getElementById('peLat').value ? parseFloat(document.getElementById('peLat').value) : null,
    lng: document.getElementById('peLng').value ? parseFloat(document.getElementById('peLng').value) : null,
    experience: document.getElementById('peExperience').value,
    fee_start: parseInt(document.getElementById('peFee').value) || 0,
    bio: document.getElementById('peBio').value,
  };
  const { error } = await sb.from('teacher_profiles').update(payload).eq('profile_id', uid);
  if(error){ toast('❌ ' + error.message, 'err'); return; }

  const scheduleLines = document.getElementById('peSchedule').value.split('\n').map(l=>l.trim()).filter(Boolean);
  const slots = scheduleLines.map(l=>{
    const [day,time,subj] = l.split('|').map(s=>s.trim());
    return { teacher_id: uid, day, time, subj };
  }).filter(s=>s.day && s.time && s.subj);
  await sb.from('schedule_slots').delete().eq('teacher_id', uid);
  if(slots.length) await sb.from('schedule_slots').insert(slots);

  toast('✅ Profile updated', 'ok');
  ensureTeachers(true);
  loadOwnTeacherProfile();
}

// its save button are never touched, and so this can move on to the
// dashboard afterward instead of staying on the same screen.

    subjects: document.getElementById('peSubjects').value.split(',').map(s=>s.trim()).filter(Boolean),

    maps_link: document.getElementById('peMapsLink').value.trim(),
    lat: document.getElementById('peLat').value ? parseFloat(document.getElementById('peLat').value) : null,
    lng: document.getElementById('peLng').value ? parseFloat(document.getElementById('peLng').value) : null,
    experience: document.getElementById('peExperience').value,
    fee_start: parseInt(document.getElementById('peFee').value) || 0,
    bio: document.getElementById('peBio').value,
  };
  const { error } = await sb.from('teacher_profiles').update(payload).eq('profile_id', uid);
  if(error){ toast('❌ ' + error.message, 'err'); return; }

  const scheduleLines = document.getElementById('peSchedule').value.split('\n').map(l=>l.trim()).filter(Boolean);
  const slots = scheduleLines.map(l=>{
    const [day,time,subj] = l.split('|').map(s=>s.trim());
    return { teacher_id: uid, day, time, subj };
  }).filter(s=>s.day && s.time && s.subj);
  await sb.from('schedule_slots').delete().eq('teacher_id', uid);
  if(slots.length) await sb.from('schedule_slots').insert(slots);

  toast('🎉 Profile saved — welcome to your dashboard!', 'ok');
